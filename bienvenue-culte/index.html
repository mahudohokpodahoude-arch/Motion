<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bienvenue · Culte de Célébration et d'actions de Grâce</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Yellowtail;src:url(fonts/yellowtail-latin-400-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
:root{--peach:#ffd29a;--cream:#f6e0bb;--navy:#17106e;--orange:#ff5a36;--gold:#e2a45d}
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a0560}
#bg{position:absolute;left:0;top:0}
.abs{position:absolute;white-space:nowrap;line-height:1}
.c{left:0;width:1920px;text-align:center}
.an{font-family:Anton,Impact,sans-serif}
.mo{font-family:Montserrat,sans-serif}
.glow{text-shadow:0 0 40px rgba(170,140,255,.6),0 6px 22px rgba(8,4,60,.55)}
.layer{position:absolute;left:0;top:0}
.box{background:rgba(22,15,115,.92);box-shadow:0 18px 50px rgba(5,2,50,.5)}
.cell{position:absolute;top:0;height:150px;display:flex;align-items:center;justify-content:center;gap:26px;color:#fff}
.sep{position:absolute;top:28px;width:3px;height:94px;background:rgba(255,255,255,.35)}
</style></head><body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>

  <!-- logos -->
  <div class="abs" style="left:96px;top:58px;width:152px;height:155px">
    <img class="layer" src="assets/zone_white.svg" width="152" height="155"><img class="layer" src="assets/zone_org.svg" width="152" height="155">
  </div>
  <img class="abs" src="assets/milmo_white.svg" style="right:96px;top:84px" width="380" height="99">

  <!-- title -->
  <div class="abs c" style="top:60px;font-family:Yellowtail,cursive;font-size:205px;color:#fff;padding-top:18px;text-shadow:0 0 42px rgba(170,140,255,.6),0 6px 22px rgba(8,4,60,.5)">Bienvenue</div>
  <div class="abs c mo" style="top:306px;font-size:44px;font-weight:800;letter-spacing:.24em;color:#fff;text-transform:uppercase">à notre culte de</div>
  <div class="abs c an glow" id="t1" style="top:424px;font-size:250px;color:#fff">CÉLÉBRATION</div>
  <div class="abs c" style="top:696px"><span class="an" style="display:inline-block;background:var(--cream);color:var(--navy);font-size:100px;padding:14px 46px 5px;transform:rotate(-1.4deg);box-shadow:0 14px 34px rgba(5,2,50,.5)">ET D'ACTIONS DE GRÂCE</span></div>

  <!-- info band -->
  <div class="abs box" style="left:150px;top:850px;width:1620px;height:150px">
    <!-- address -->
    <div class="cell" style="left:0;width:700px">
      <svg width="58" height="72" viewBox="0 0 34 42"><path d="M17 1C9 1 3 7 3 15c0 10 14 25 14 25s14-15 14-25C31 7 25 1 17 1z" fill="#FEBF00"/><circle cx="17" cy="15" r="5.5" fill="#17106e"/></svg>
      <div><div class="mo" style="font-size:44px;font-weight:800;letter-spacing:.03em">ZONE 242 · SIKÈCODJI</div>
      <div class="mo" style="font-size:34px;font-weight:600;color:#ddd6ff;margin-top:12px">Rue de Golf-FM, Cotonou</div></div>
    </div>
    <div class="sep" style="left:700px"></div>
    <!-- phone -->
    <div class="cell" style="left:703px;width:470px">
      <svg width="52" height="52" viewBox="0 0 24 24"><path d="M6.6 10.800a15.100 15.100 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25c1.100.35 2.300.55 3.600.55a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.600 21 3 13.400 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.55 3.600a1 1 0 0 1-.25 1z" fill="#FEBF00"/></svg>
      <div class="an" style="font-size:60px;letter-spacing:.03em">01 41 62 77 77</div>
    </div>
    <div class="sep" style="left:1173px"></div>
    <!-- social -->
    <div class="cell" style="left:1176px;width:444px;flex-direction:column;gap:16px">
      <div style="display:flex;gap:30px;align-items:center;height:44px">
        <svg width="34" height="38" viewBox="0 0 12 14"><path d="M8 0v9.2a3 3 0 1 1-3-3v2a1 1 0 1 0 1 1V0z M8 0c.2 1.6 1.4 2.8 3.2 3v2c-1.2 0-2.2-.4-3.2-1z" fill="#fff"/></svg>
        <svg width="46" height="34" viewBox="0 0 15 11"><rect width="15" height="11" rx="3" fill="#fff"/><path d="M6 3l4 2.5L6 8z" fill="#17106e"/></svg>
        <svg width="38" height="38" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="6" cy="6" r="2.2" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9" cy="3" r=".8" fill="#fff"/></svg>
        <svg width="26" height="44" viewBox="0 0 8 14"><path d="M5.2 14V7.7h2.1l.3-2.5H5.2V3.7c0-.7.2-1.2 1.2-1.2H7.7V.3C7.5.3 6.700.2 5.800.2 3.900.2 2.700 1.300 2.700 3.400v1.800H.6v2.500h2.100V14z" fill="#fff"/></svg>
      </div>
      <div class="mo" style="font-size:38px;font-weight:800;letter-spacing:.06em">ZONE 242</div>
    </div>
  </div>

  <div class="abs c mo" style="top:1030px;font-size:26px;font-weight:700;letter-spacing:.34em;color:var(--gold)">CONNECTER · TRANSFORMER · ENVOYER</div>
</div>
<script>
const cv=document.getElementById('bg'),ctx=cv.getContext('2d'),CX=960,CY=520;
const rnd=(()=>{let s=5;return()=>(s=(s*16807)%2147483647)/2147483647})();
const stars=Array.from({length:180},()=>({x:rnd()*1920,y:rnd()*1080,r:.7+rnd()*1.8,a:.25+rnd()*.6}));
function bg(t){
  ctx.fillStyle='#0a0560';ctx.fillRect(0,0,1920,1080);
  let g=ctx.createRadialGradient(CX,CY,0,CX,CY,1250);
  g.addColorStop(0,'rgba(120,80,235,.95)');g.addColorStop(.18,'rgba(70,40,210,.8)');g.addColorStop(.5,'rgba(32,16,160,.55)');g.addColorStop(1,'rgba(8,3,70,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);
  ctx.globalCompositeOperation='lighter';ctx.filter='blur(5px)';
  const N=26,rot=t*.03;
  for(let i=0;i<N;i++){const a=rot+i*Math.PI*2/N,L=1500,w=.024+(i%3)*.005;
    const lg=ctx.createRadialGradient(CX,CY,0,CX,CY,L);
    lg.addColorStop(0,'rgba(225,195,250,.5)');lg.addColorStop(.35,'rgba(205,170,240,.24)');lg.addColorStop(1,'rgba(190,150,235,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(a-w)*L,CY+Math.sin(a-w)*L);ctx.lineTo(CX+Math.cos(a+w)*L,CY+Math.sin(a+w)*L);ctx.closePath();ctx.fill();}
  ctx.filter='blur(40px)';g=ctx.createRadialGradient(CX,CY,0,CX,CY,150);
  g.addColorStop(0,'rgba(245,230,255,.9)');g.addColorStop(.4,'rgba(190,150,255,.45)');g.addColorStop(1,'rgba(120,80,230,0)');
  ctx.fillStyle=g;ctx.fillRect(CX-220,CY-220,440,440);ctx.filter='none';
  for(const s of stars){ctx.fillStyle=`rgba(215,205,255,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  g=ctx.createRadialGradient(CX,CY,500,CX,CY,1150);g.addColorStop(0,'rgba(5,2,45,0)');g.addColorStop(1,'rgba(5,2,45,.62)');
  ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);
}
bg(2.4);
window.ready=(async()=>{await Promise.all(['100px Anton','100px Yellowtail','600 20px Montserrat','700 20px Montserrat','800 20px Montserrat'].map(f=>document.fonts.load(f)));await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));})();
</script></body></html>
