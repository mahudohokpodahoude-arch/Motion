<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Le week-end en chiffres · Week-end Zone Women</title>
    <script src="gsap/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/bebas-neue-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ee1a02; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Mont", sans-serif; color: #fff; background: linear-gradient(160deg, #ee1a02 0%, #f12e04 40%, #f5541a 80%, #fb7a2a 100%); }
      .abs { position: absolute; }
      .sc { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 50%; will-change: transform; }
      .bg-blue { background: #0260a6; } .bg-cream { background: #ffe3cf; }
      .bg-red { background: linear-gradient(160deg, #ee1a02 0%, #f12e04 40%, #f5541a 80%, #fb7a2a 100%); }
      .slab { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      .num { left: 0; width: 1080px; top: 250px; text-align: center; font-family: "Bebas", sans-serif; font-size: 820px; line-height: .8; letter-spacing: .01em; white-space: nowrap; transform-origin: 50% 60%; }
      .lbl { left: 50%; top: 930px; transform-origin: 50% 50%; font-family: "Bebas", sans-serif; font-size: 170px; line-height: 1; letter-spacing: .06em; padding: 18px 46px 4px; white-space: nowrap; }
      .line { left: 90px; width: 900px; top: 1190px; text-align: center; font-weight: 800; font-size: 34px; letter-spacing: .1em; line-height: 1.3; overflow: hidden; }
      .line div { transform: translateY(110%); }
      .av { width: 150px; height: 150px; border-radius: 50%; border: 8px solid #fff; background: #fb7a2a; overflow: hidden; box-shadow: 0 12px 26px rgba(90,0,0,.35); }
      .av img { width: 100%; height: 190%; object-fit: cover; object-position: 50% 0; display: block; }
      .tag { transform-origin: 50% 50%; font-weight: 800; letter-spacing: .08em; white-space: nowrap; }
      #tick { left: -60px; top: 1585px; width: 1240px; height: 100px; background: #121212; transform: rotate(-3deg); overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
      #tick .t { white-space: nowrap; font-weight: 800; font-size: 36px; letter-spacing: .16em; line-height: 100px; color: #fff; display: inline-block; }
      #tick .t b { color: #f5541a; margin: 0 26px; font-weight: 800; }
      #lock { display: block; margin: 0 auto; filter: drop-shadow(0 0 14px rgba(255,255,255,.45)); }
      #flash { inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <div id="scenes"></div>
      <div id="tick" class="abs"><div class="t" id="tt"></div></div>
      <div id="flash" class="abs"></div>
      <audio id="snd" src="assets/musique.mp3" data-start="0" data-duration="24" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const T = [0, 3.6, 7.3, 12.0, 16.6, 20.3], END = 24;
      // bande défilante
      const unit = "WEEK-END ZONE WOMEN<b>●</b>27–29 NOVEMBRE<b>●</b>ZONE 242 · SIKÈCODJI<b>●</b>GRATUIT · 150 PLACES<b>●</b>";
      $("#tt").innerHTML = unit.repeat(4);
      const NUMS = [
        { n: 3, label: "JOURS", line: "DU VENDREDI 27 AU DIMANCHE 29 NOVEMBRE", bg: "bg-blue", num: "#ffe3cf", sh: "#02365f", lb: "#f5541a", lc: "#fff", tc: "#fff" },
        { n: 6, label: "SESSIONS", line: "PANELS · SANTÉ · GRANDE TABLE RONDE", bg: "bg-cream", num: "#ee1a02", sh: "#0260a6", lb: "#121212", lc: "#ffe3cf", tc: "#10143a" },
        { n: 14, label: "INTERVENANTES", small: true, line: "DES FEMMES QUI PRENNENT LA PAROLE", bg: "bg-red", num: "#ffffff", sh: "#8f0d00", lb: "#ffe3cf", lc: "#d8300a", tc: "#fff", av: true },
        null,
        { n: 150, label: "PLACES", line: "GRATUIT · INSCRIPTION OBLIGATOIRE", bg: "bg-blue", num: "#ffffff", sh: "#f5541a", lb: "#ffe3cf", lc: "#0260a6", tc: "#fff" },
        "fin",
      ];
      const PH = ["mary", "anne", "huldah", "manne", "veronica", "hestia", "pelagie", "esperance", "jessie", "richmelle", "tossou", "sylvie", "marjolaine", "roukiyatou"];
      const sc = $("#scenes"); const E = [];
      NUMS.forEach((c, i) => {
        let h = "", cls = c && c !== "fin" ? c.bg : "bg-red";
        if (c && c !== "fin") {
          h += `<div class="num abs" style="color:${c.num};text-shadow:0 0 0 ${c.sh}">0</div>`;
          h += `<div class="lbl abs tag" style="background:${c.lb};color:${c.lc};${c.small ? "font-size:118px;" : ""}">${c.label}</div>`;
          h += `<div class="line abs" style="color:${c.tc}"><div>${c.line}</div></div>`;
          if (c.av) PH.forEach((p, k) => { const row = k < 7 ? 0 : 1, col = k % 7; h += `<div class="av abs" id="av${k}" style="left:${62 + (row ? 68 : 0) + col * 135 - (row ? 68 : 0)}px;top:${1275 + row * 118}px"><img src="assets/photos/${p}.png" alt=""></div>`; });
        } else if (c === null) {
          cls = "bg-blue";
          h += `<div class="abs" style="left:-100px;top:-80px;width:1500px;height:900px;background:#f5541a;transform:rotate(-12deg);opacity:.95"></div><div class="abs" style="left:0;top:880px;width:1080px;height:1100px;background:#0260a6"></div>`;
          h += `<img id="mary" class="abs" src="assets/photos/mary.png" style="left:330px;top:330px;height:1330px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))" alt="">`;
          h += `<div id="mtag" class="abs tag" style="left:60px;top:320px;background:#121212;color:#fff;font-size:40px;padding:16px 30px;transform:rotate(-4deg)">INVITÉE D'HONNEUR</div>`;
          h += `<div id="mpro" class="abs" style="left:64px;top:440px;font-weight:800;font-size:50px;letter-spacing:.12em;color:#fff;overflow:hidden"><div>PROPHÉTESSE</div></div>`;
          h += `<div id="mnm" class="abs" style="left:56px;top:490px;font-family:Bebas,sans-serif;font-size:300px;line-height:.86;color:#fff;text-shadow:10px 10px 0 #0a2b4a;letter-spacing:.01em"><div>MARY</div><div>TONGSI</div></div>`;
          h += `<div class="abs tag mp" style="left:64px;top:1130px;background:#fff;color:#d8300a;font-size:38px;padding:14px 26px;border-radius:12px">VEN. 27 · 19H45</div>`;
          h += `<div class="abs tag mp" style="left:64px;top:1220px;background:#fff;color:#d8300a;font-size:38px;padding:14px 26px;border-radius:12px">DIM. 29 · 8H45</div>`;
        } else {
          h += `<div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#ff7a33;opacity:.18;clip-path:polygon(0 0,22% 0,8% 100%,0 100%)"></div><div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#b80f00;opacity:.2;clip-path:polygon(38% 0,52% 0,34% 100%,20% 100%)"></div>`;
          h += `<img id="flock" class="abs" src="assets/lockup.png" style="left:110px;top:420px;width:860px;filter:drop-shadow(0 0 22px rgba(255,255,255,.5))" alt="">`;
          h += `<div id="fd" class="abs" style="left:0;width:1080px;top:860px;text-align:center;font-family:Bebas,sans-serif;font-size:210px;line-height:.9;color:#ffe3cf;letter-spacing:.02em">27–29</div>`;
          h += `<div id="fm" class="abs" style="left:0;width:1080px;top:1060px;text-align:center;font-weight:800;font-size:56px;letter-spacing:.14em">NOVEMBRE 2026</div>`;
          h += `<div id="fl" class="abs" style="left:60px;width:960px;top:1180px;text-align:center;font-weight:800;font-size:36px;letter-spacing:.1em;line-height:1.4;color:#ffe3cf">ZONE 242 · SIKÈCODJI<br>RUE DE GOLF FM, COTONOU</div>`;
          h += `<div id="fc" class="abs tag" style="left:50%;top:1330px;background:#121212;color:#fff;font-size:42px;padding:20px 40px;border-radius:16px">INSCRIPTION : LIEN EN BIO</div>`;
        }
        sc.insertAdjacentHTML("beforeend", `<div class="sc abs ${cls}" id="sc${i}">${h}</div>`);
        E.push($("#sc" + i));
      });
      gsap.set(".sc", { x: 1600, skewX: -12 });
      gsap.set(["#fc", ".lbl"], { xPercent: -50 });
      gsap.set(".av", { scale: 0 });
      const tl = gsap.timeline({ paused: true });
      // bande défilante (linéaire, toute la durée)
      tl.fromTo("#tt", { x: 0 }, { x: -1900, duration: END, ease: "none" }, 0);
      tl.fromTo("#tick", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, .3);
      NUMS.forEach((c, i) => {
        const s = T[i], d = (T[i + 1] || END) - T[i], e = E[i];
        // entrée : l'aplat entre en diagonale ; flash
        tl.fromTo(e, { x: 1600, skewX: -12 }, { x: 0, skewX: 0, duration: .5, ease: "power4.out" }, i ? s - .1 : s);
        if (i) tl.fromTo("#flash", { opacity: .35 }, { opacity: 0, duration: .3, ease: "power2.out", immediateRender: false }, s + .15);
        if (i === 0) tl.set(e, { x: 0, skewX: 0 }, 0);
        if (c && c !== "fin") {
          const n = e.querySelector(".num"), lb = e.querySelector(".lbl"), ln = e.querySelector(".line div");
          const o = { v: 0 };
          tl.fromTo(n, { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, ease: "expo.out" }, s + .35);
          tl.to(o, { v: c.n, duration: 1.3, ease: "power3.out", onUpdate: () => { n.textContent = Math.round(o.v); } }, s + .4);
          tl.fromTo(n, { textShadow: `0px 0px 0 ${c.sh}` }, { textShadow: `18px 18px 0 ${c.sh}`, duration: .5, ease: "power3.out" }, s + .9);
          tl.fromTo(lb, { scale: 0, rotation: -14 }, { scale: 1, rotation: -4, duration: .5, ease: "back.out(2.4)" }, s + 1.1);
          tl.to(ln, { y: 0, duration: .5, ease: "power3.out" }, s + 1.5);
          tl.to(n, { scale: 1.04, duration: d - 1.6, ease: "sine.inOut" }, s + 1.5);
          if (c.av) PH.forEach((p, k) => tl.to(`#av${k}`, { scale: 1, duration: .4, ease: "back.out(2.2)" }, s + 1.4 + k * .07));
        } else if (c === null) {
          tl.fromTo("#mary", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: .7, ease: "power4.out" }, s + .35);
          tl.fromTo("#mtag", { scale: 0, rotation: -14 }, { scale: 1, rotation: -4, duration: .5, ease: "back.out(2.4)" }, s + .8);
          tl.fromTo("#mpro div", { y: "110%" }, { y: 0, duration: .45, ease: "power3.out" }, s + 1.1);
          tl.fromTo("#mnm div", { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: .55, ease: "power4.out", stagger: .15 }, s + 1.2);
          tl.fromTo(".mp", { y: 40, opacity: 0, scale: .8 }, { y: 0, opacity: 1, scale: 1, duration: .45, ease: "back.out(2)", stagger: .15 }, s + 2.2);
          tl.fromTo("#mary", { scale: 1 }, { scale: 1.04, duration: d - 1.2, ease: "sine.inOut", transformOrigin: "50% 60%" }, s + 1.2);
        } else {
          tl.fromTo("#flock", { scale: .8, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: "back.out(1.8)" }, s + .35);
          tl.fromTo("#fd", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "expo.out" }, s + .9);
          tl.fromTo(["#fm", "#fl"], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: "power3.out", stagger: .15 }, s + 1.3);
          tl.fromTo("#fc", { scale: 0, rotation: -10 }, { scale: 1, rotation: -3, duration: .5, ease: "back.out(2.2)" }, s + 1.9);
        }
      });
      tl.to("#scenes", { opacity: 0, duration: .5 }, END - .55);
      tl.to("#tick", { opacity: 0, duration: .4 }, END - .5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
