<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>IBULD — Titres intervenants</title>
<style>
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
:root{--a:#1c1470;--b:#3b24b8;--chip:#ffc82e;--chipt:#1a1240;--sub:#ffe08a;--bar:#ffc82e}
body.rubis{--a:#5a0716;--b:#c01f3a;--chip:#ffc82e;--chipt:#3a0610;--sub:#ffe08a;--bar:#ffc82e}
.lt{position:absolute;left:100px;bottom:96px;display:flex;flex-direction:column;align-items:flex-start;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.chip{background:var(--chip);color:var(--chipt);font-family:Montserrat;font-weight:800;font-size:27px;letter-spacing:.12em;text-transform:uppercase;padding:12px 30px 12px 26px;margin-left:22px;white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.box{display:flex;background:linear-gradient(100deg,var(--a),var(--b));border-radius:0 6px 6px 0}
.bar{width:22px;background:var(--bar)}
.txt{padding:20px 80px 24px 34px}
.name{font-family:Montserrat;font-weight:800;font-size:68px;line-height:1.1;color:#fff;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.role{margin-top:8px;font-family:Montserrat;font-weight:700;font-size:36px;line-height:1.15;color:var(--sub);white-space:nowrap}
</style></head><body>
<div class="lt"><div class="chip" id="tag"></div><div class="box"><div class="bar"></div><div class="txt"><div class="name" id="name"></div><div class="role" id="role"></div></div></div></div>
</body></html>
