<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>IBULD — Écran d'attente</title>
<style>
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#140d55}
:root{--gold:#ffc82e;--soft:#ffe08a}
#c{position:relative;width:1920px;height:1080px;font-family:Montserrat;color:#fff;
 background:radial-gradient(1100px 800px at 50% 38%,#4a2fd0 0%,#2b1c9c 45%,#160e5c 100%)}
.shape{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;filter:blur(60px)}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.emb{width:270px;height:auto;border-radius:20px;box-shadow:0 0 0 4px #ffc82e,0 14px 30px rgba(0,0,0,.5)}
.brand{margin-top:14px;font-weight:800;font-size:34px;letter-spacing:.5em;padding-left:.5em;color:var(--gold)}
.t1{margin-top:30px;font-weight:700;font-size:40px;letter-spacing:.3em;padding-left:.3em;color:var(--soft)}
.t2{margin-top:6px;font-weight:800;font-size:118px;line-height:1.05;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.t3{margin-top:10px;font-weight:600;font-size:44px;color:#fff}
.date{margin-top:22px;display:inline-flex;gap:0;font-weight:800;font-size:38px;letter-spacing:.06em;border-radius:6px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.date span{padding:12px 30px}.date .a{background:var(--gold);color:#1a1240}.date .b{background:#0f0a42;color:#fff}
.cd{margin-top:36px;display:flex;gap:26px;align-items:flex-start}
.u{width:200px;background:linear-gradient(180deg,#120b4a,#0b0733);border-radius:10px;border-top:8px solid var(--gold);padding:14px 0 16px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.u b{display:block;font-weight:800;font-size:104px;line-height:1;font-variant-numeric:tabular-nums}
.u i{display:block;font-style:normal;font-weight:700;font-size:24px;letter-spacing:.28em;padding-left:.28em;color:var(--soft);margin-top:4px}
.sep{font-weight:800;font-size:90px;color:var(--gold);margin-top:34px}
.msg{margin-top:30px;font-weight:600;font-size:36px;color:#fff}
.loc{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-weight:600;font-size:28px;color:var(--soft);letter-spacing:.06em}
.loc b{color:#fff;font-weight:800}
body.nocount .cd{visibility:hidden}
</style></head><body>
<div id="c">
 <svg class="shape" viewBox="0 0 1920 1080">
  <polygon points="0,0 560,0 0,380" fill="#ffc82e" opacity=".95"/><polygon points="0,0 400,0 0,270" fill="#1c1470"/>
  <polygon points="1920,1080 1360,1080 1920,700" fill="#ffc82e" opacity=".95"/><polygon points="1920,1080 1520,1080 1920,810" fill="#1c1470"/>
  
 </svg>
 <div class="glow" style="left:120px;top:560px;width:420px;height:420px;background:#7a5cff;opacity:.35"></div>
 <div class="glow" style="right:140px;top:120px;width:380px;height:380px;background:#7a5cff;opacity:.3"></div>
 <div class="col">
  <img class="emb" src="assets/emblem-ibuld.png" alt="">
    <div class="t1">CÉRÉMONIE DE</div>
  <div class="t2">GRADUATION</div>
  <div class="t3">Remise des diplômes</div>
  <div class="date"><span class="a">SAMEDI 21 NOVEMBRE 2026</span><span class="b">09H00</span></div>
  <div class="cd" id="cd">
   <div class="u"><b id="d">00</b><i>JOURS</i></div><div class="sep">:</div>
   <div class="u"><b id="h">00</b><i>HEURES</i></div><div class="sep">:</div>
   <div class="u"><b id="m">00</b><i>MINUTES</i></div><div class="sep">:</div>
   <div class="u"><b id="s">00</b><i>SECONDES</i></div>
  </div>
  <div class="msg" id="msg">La cérémonie va bientôt commencer</div>
 </div>
 <div class="loc"><b>MILMO AKPAKPA SACRÉ-CŒUR</b> &nbsp;•&nbsp; Cotonou</div>
</div>
<script>
const q=new URLSearchParams(location.search);
if(q.has('nocount'))document.body.classList.add('nocount');
const TARGET=new Date('2026-11-21T09:00:00+01:00').getTime(); // heure du Bénin (UTC+1)
const p=n=>String(n).padStart(2,'0');
function draw(t){
  const [d,h,m,s]=t;
  for(const [k,v] of Object.entries({d,h,m,s}))document.getElementById(k).textContent=p(v);
}
function tick(){
  let diff=Math.max(0,Math.floor((TARGET-Date.now())/1000));
  draw([Math.floor(diff/86400),Math.floor(diff%86400/3600),Math.floor(diff%3600/60),diff%60]);
  if(diff===0){document.getElementById('msg').textContent='La cérémonie commence';}
}
if(q.has('t')){draw(q.get('t').split(':').map(Number));}
else{tick();setInterval(tick,250);}
</script></body></html>
