<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#032a1a}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 850px at 50% 40%,#12905a 0%,#0a5e3a 45%,#043320 100%)}
#rays{position:absolute;left:210px;top:-330px;width:1500px;height:1500px;
 background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,226,140,0) 0deg 8deg,rgba(255,226,140,.13) 10deg,rgba(255,226,140,0) 12deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%)}
#glow{position:absolute;left:560px;top:30px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,90,.5),rgba(255,214,90,0) 66%)}
#ring{position:absolute;left:960px;top:400px;border:8px solid #ffc82e;border-radius:50%;transform:translate(-50%,-50%)}
#tile{position:absolute;left:700px;top:238px;width:520px;height:325px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 7px #ffc82e,0 30px 60px rgba(0,0,0,.55);transform-origin:50% 50%}
#tile img{width:100%;height:100%;display:block}
#sweep{position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg)}
.sp{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%)}
.t{position:absolute;left:0;right:0;text-align:center;font-family:Montserrat;color:#fff;white-space:nowrap}
#inst{top:628px;font-weight:700;font-size:27px;letter-spacing:.32em;color:#ffe08a}
#title{top:690px;font-weight:800;font-size:96px;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4)}
#sub{top:828px;font-weight:700;font-size:46px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#bar{position:absolute;left:810px;top:812px;height:6px;background:#ffc82e;border-radius:3px}
</style>
<div id=bg></div><div id=rays></div><div id=glow></div><div id=ring></div>
<div id=tile><img src="assets/logo-ibuld-crop.png"><div id=sweep></div></div>
<div id=sparks></div>
<div class=t id=inst>INSTITUT BIBLIQUE UNIVERSITAIRE DE LEADERSHIP ET DE DÉVELOPPEMENT</div>
<div class=t id=title>CÉRÉMONIE DE GRADUATION</div><div id=bar></div>
<div class=t id=sub>Remise des diplômes</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3), ob=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
// étincelles (étoiles à 4 branches)
const SP=[[640,260,2.2],[1290,230,2.5],[560,470,2.8],[1360,430,2.4],[760,170,2.9],[1180,160,2.6],[690,600,3.1],[1250,590,3.0],[960,120,2.3],[600,350,3.3],[1330,330,3.2],[1080,640,2.7]];
$('sparks').innerHTML=SP.map(()=>`<svg class="sp" viewBox="-20 -20 40 40"><path d="M0 -20 Q2 -2 20 0 Q2 2 0 20 Q-2 2 -20 0 Q-2 -2 0 -20Z" fill="#fff6c8"/></svg>`).join('');
const sps=[...document.querySelectorAll('.sp')];
window.setT=t=>{
  $('bg').style.opacity=.35+.65*P(t,0,.8);
  $('rays').style.transform=`rotate(${t*7}deg)`;$('rays').style.opacity=P(t,.3,1.4);
  $('glow').style.opacity=P(t,.4,1.6)*(0.85+0.15*Math.sin(t*2.6));
  // logo : entrée avec rebond
  const e=P(t,.4,1.5), s=.55+.45*ob(e);
  $('tile').style.opacity=oc(P(t,.4,1.0));$('tile').style.transform=`scale(${s}) rotate(${(1-oc(e))*-6}deg)`;
  // balayage de lumière
  $('sweep').style.left=(-60+210*io(P(t,1.6,2.6)))+'%';$('sweep').style.opacity=P(t,1.6,1.7)*(1-P(t,2.5,2.6));
  // onde dorée
  const r=P(t,1.5,2.7);const d=260+1500*oc(r);$('ring').style.width=d+'px';$('ring').style.height=d+'px';$('ring').style.opacity=r>0&&r<1?.9*(1-r):0;$('ring').style.borderWidth=(10*(1-r)+1)+'px';
  // étincelles
  sps.forEach((el,i)=>{const [x,y,t0]=SP[i];el.style.left=x+'px';el.style.top=y+'px';const q=P(t,t0-.8,t0+.4);const sc=Math.sin(Math.PI*q);el.style.transform=`translate(-50%,-50%) scale(${sc*1.2}) rotate(${q*90}deg)`;el.style.opacity=sc});
  // textes
  const up=(id,a,b,dy)=>{const q=oc(P(t,a,b));$(id).style.opacity=q;$(id).style.transform=`translateY(${(1-q)*dy}px)`};
  up('inst',2.6,3.3,24);up('title',3.2,4.0,50);up('sub',4.0,4.7,30);
  const w=1100*oc(P(t,3.9,4.6));$('bar').style.width=w+'px';$('bar').style.left=(960-w/2)+'px';$('bar').style.opacity=P(t,3.9,4.1);
  // respiration finale
  const br=1+.012*Math.sin(Math.max(0,t-4.6)*2.4)*P(t,4.6,5);$('tile').style.transform+=` scale(${br})`;
};
</script>
