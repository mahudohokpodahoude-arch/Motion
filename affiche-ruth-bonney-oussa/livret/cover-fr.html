<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:'PF';src:url(../fonts/PlayfairDisplay.ttf);font-weight:400 900}
@font-face{font-family:'GV';src:url(../fonts/GreatVibes.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.c{position:relative;width:905px;height:1280px;overflow:hidden;background:url(assets/cover-clean.png) 0 0/905px 1280px;font-family:'Inter','Liberation Sans',Arial,sans-serif}
.abs{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.gold{background:linear-gradient(180deg,#fbe38a 0%,#e0b43a 48%,#b88614 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.en{top:72px;left:556px;right:auto;transform:translateX(0);text-align:left;font-family:'PF',serif;font-weight:500;color:#fff;font-size:30px;letter-spacing:.04em}
.mem{top:70px;font-family:'GV',cursive;font-size:150px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.veuve{top:854px;font-family:'PF',serif;font-weight:500;color:#fff;font-size:31px;letter-spacing:.05em}
.name{top:888px;font-family:'PF',serif;font-weight:800;font-size:54px;line-height:1.2;letter-spacing:-.01em;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.aka{top:958px;display:flex;justify-content:center;align-items:center;gap:14px}
.aka span{color:#fff;font-size:32px}
.pill{background:#1f252c;color:#f0c24a;font-weight:700;font-size:27px;padding:8px 22px;border-radius:22px}
.dates{top:1006px;color:#fff;font-size:35px;letter-spacing:-.01em}.dates b{font-weight:800}
.rule{top:1090px;left:372px;right:372px;height:1.5px;background:linear-gradient(90deg,transparent,#d9a92f,transparent)}
.rip{top:1122px;font-family:'GV',cursive;font-size:64px;line-height:1.2}
</style></head><body><div class="c">
 <div class="abs en" id="en">EN</div>
 <div class="abs mem gold" id="mem">Mémoire</div>
 <div class="abs veuve">VEUVE</div>
 <div class="abs name gold" id="nm">Ruth BONNEY OUSSA</div>
 <div class="abs aka"><span>(alias Da Adzo)</span><span class="pill">63 ans</span></div>
 <div class="abs dates">Rappelée à Dieu le <b>26 octobre 2026</b></div>
 <div class="abs rule"></div>
 <div class="abs rip gold" id="rip">Repose en paix, chère maman</div>
</div>
<script>
Promise.all(['500 30px PF','800 30px PF','40px GV'].map(f=>document.fonts.load(f))).then(()=>{
  function fit(id,w){const e=document.getElementById(id);const s=document.createElement('span');s.textContent=e.textContent;s.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:'+getComputedStyle(e).font+';letter-spacing:'+getComputedStyle(e).letterSpacing;document.body.appendChild(s);let fs=parseFloat(getComputedStyle(e).fontSize);while(s.getBoundingClientRect().width>w&&fs>10){fs-=1;s.style.fontSize=fs+'px'}while(s.getBoundingClientRect().width<w-6&&fs<260){fs+=1;s.style.fontSize=fs+'px'}e.style.fontSize=fs+'px';s.remove()}
  fit('nm',552);fit('rip',582);fit('mem',440);
  document.body.setAttribute('data-ready','1')});
</script></body></html>
