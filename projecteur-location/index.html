<!doctype html>
<!-- PUBLICITÉ — Location projecteur Home Cinéma (motion design 2D, 1080×1920, 45 s, 30 i/s).
     Textes commerciaux modifiables : variables ci-dessous (ou --variables au rendu), voir README.md. -->
<html lang="fr" data-composition-variables='[
  {"id":"prix","type":"string","label":"Prix par jour (sans devise)","default":"5 000"},
  {"id":"devise","type":"string","label":"Devise","default":"FCFA"},
  {"id":"telephone","type":"string","label":"Numéro WhatsApp","default":"0167326082"},
  {"id":"ville","type":"string","label":"Ville","default":"COTONOU, BÉNIN"},
  {"id":"livraison","type":"string","label":"Mention livraison","default":"LIVRAISON POSSIBLE"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Location Projecteur — Pub 2D</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/DrawSVGPlugin.min.js"></script>
    <script src="assets/vendor/MorphSVGPlugin.min.js"></script>
    <script src="assets/vendor/MotionPathPlugin.min.js"></script>
    <script src="assets/vendor/CustomEase.min.js"></script>
    <style>
      @font-face { font-family: "Oswald"; font-weight: 500; src: url("assets/fonts/oswald-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Oswald"; font-weight: 600; src: url("assets/fonts/oswald-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Oswald"; font-weight: 700; src: url("assets/fonts/oswald-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url("assets/fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }

      :root {
        --navy: #0a1a3a; --navy-deep: #040b1b; --navy-mid: #12305f; --navy-card: #0e2449;
        --gold: #ffbf1f; --gold-hi: #ffe37a; --gold-lo: #e88f00;
        --white: #ffffff; --soft: #c9d6ee;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--navy-deep); }
      body { color: var(--white); font-family: "Montserrat", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--navy-deep); }
      .layer, .scene { position: absolute; inset: 0; }
      .scene { overflow: hidden; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }

      /* ---- fond ---- */
      #bg { background: radial-gradient(120% 70% at 50% 28%, #183a6e 0%, #0b1f42 42%, #050d20 78%, #030915 100%); }
      #bg-grid { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; opacity: .55; }
      #bg-glow-a, #bg-glow-b { position: absolute; border-radius: 50%; }
      #bg-glow-a { left: -260px; top: 180px; width: 900px; height: 900px; background: radial-gradient(circle, rgba(255,191,31,.16) 0%, rgba(255,191,31,0) 65%); }
      #bg-glow-b { left: 380px; top: 1100px; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(64,140,255,.20) 0%, rgba(64,140,255,0) 65%); }
      #bg-streaks { position: absolute; left: -400px; top: -200px; width: 1900px; height: 2400px; opacity: .5; }
      canvas.fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
      #vignette { background: radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
      #flash { background: radial-gradient(circle at 50% 50%, rgba(255,240,200,1) 0%, rgba(255,200,60,.85) 40%, rgba(255,191,31,0) 75%); opacity: 0; pointer-events: none; }

      /* ---- typographie ---- */
      .osw { font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; line-height: 1.05; letter-spacing: .005em; }
      .mont { font-family: "Montserrat", sans-serif; }
      .gold { color: var(--gold); }
      .goldfx { background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 48%, var(--gold-lo) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .glow { filter: drop-shadow(0 0 22px rgba(255,180,0,.35)); }
      .center { left: 0; right: 0; text-align: center; }
      .ch { display: inline-block; }
      .wmask { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .03em 0; margin: -.14em 0 0; }
      .w { display: inline-block; }
      .lmask { display: block; overflow: hidden; padding-top: .16em; margin-top: -.16em; }
      .lmask > span { display: block; }
      .pill { display: inline-block; padding: 12px 30px 12px; border-radius: 10px; background: var(--gold); color: #0a1530; font-family: "Montserrat", sans-serif; font-weight: 900; letter-spacing: .08em; }
      .ico { width: 100%; height: 100%; display: block; overflow: visible; }

      /* ---- le projecteur (photo détourée de l'affiche) ---- */
      #hero { position: absolute; left: 160px; top: 740px; width: 760px; height: 520px; z-index: 45; }
      #hero-in { position: absolute; inset: 0; }
      #hero-glow { position: absolute; left: -200px; top: -160px; width: 1160px; height: 840px; background: radial-gradient(closest-side, rgba(255,191,31,.30), rgba(255,191,31,0)); }
      #hero-shadow { position: absolute; left: 70px; top: 470px; width: 620px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0)); }
      #hero-img { position: absolute; left: 0; top: 0; width: 760px; height: 520px; display: block; }
      #hero-outline { position: absolute; left: 0; top: 0; width: 760px; height: 520px; overflow: visible; }
      #hero-outline path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
      #lens-flare { position: absolute; left: 292px; top: 192px; width: 0; height: 0; }
      #lens-flare > div { position: absolute; left: 0; top: 0; }
      .flare-core { width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(170,215,255,.85) 14%, rgba(80,150,255,.35) 38%, rgba(80,150,255,0) 70%); }
      .flare-streak { width: 1400px; height: 26px; margin: -13px 0 0 -700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(220,240,255,.95), rgba(120,180,255,.4) 40%, rgba(120,180,255,0)); }
      .flare-star { width: 340px; height: 340px; margin: -170px 0 0 -170px; background:
        linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 100%) center / 100% 4px no-repeat,
        linear-gradient(0deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 100%) center / 4px 100% no-repeat; }
      #beam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }

      /* ---- calque de transitions ---- */
      #tr { z-index: 70; pointer-events: none; }
      #tr .bar { position: absolute; left: -500px; width: 2100px; height: 330px; }
      #tr .band { position: absolute; left: 0; width: 1080px; height: 482px; background: linear-gradient(180deg, #0f2a57, #08163a); }
      #tr .band::after { content: ""; position: absolute; top: 0; bottom: 0; width: 16px; background: var(--gold); box-shadow: 0 0 30px rgba(255,191,31,.8); }
      #tr .band.l::after { right: 0; }
      #tr .band.r::after { left: 0; }
      #sweep-line { position: absolute; left: -40px; width: 1160px; height: 10px; top: 0; border-radius: 6px; background: linear-gradient(90deg, rgba(255,191,31,0), #fff3c4 30%, #ffffff 50%, #fff3c4 70%, rgba(255,191,31,0)); box-shadow: 0 0 40px 10px rgba(255,191,31,.65); }
      #iris-ring { position: absolute; left: 540px; top: 960px; width: 0; height: 0; }
      #iris-ring > div { position: absolute; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; border-radius: 50%; border: 14px solid var(--gold); box-shadow: 0 0 50px rgba(255,191,31,.9), inset 0 0 40px rgba(255,191,31,.6); }
      #split-line { position: absolute; left: 536px; top: 0; width: 8px; height: 1920px; background: linear-gradient(180deg, rgba(255,191,31,0), #fff 30%, #fff 70%, rgba(255,191,31,0)); box-shadow: 0 0 40px 12px rgba(255,191,31,.7); }
    </style>
    <link rel="stylesheet" href="scenes/scenes.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="45">
      <!-- fond partagé (parallaxe multicouche) -->
      <div id="bg" class="layer">
        <div id="bg-glow-a"></div>
        <div id="bg-glow-b"></div>
        <svg id="bg-streaks" viewBox="0 0 1900 2400"></svg>
        <svg id="bg-grid" viewBox="0 0 1320 2160"></svg>
      </div>
      <canvas id="fx-back" class="fx" width="1080" height="1920" style="z-index:5"></canvas>

      <!-- scènes : chaque section est remplie par scenes/sN-*.js -->
      <section id="s1" class="scene clip" data-start="0" data-duration="5.05" data-track-index="1" style="z-index:11"></section>
      <section id="s2" class="scene clip" data-start="4.8" data-duration="6.5" data-track-index="2" style="z-index:12"></section>
      <section id="s3" class="scene clip" data-start="10.95" data-duration="10.35" data-track-index="3" style="z-index:13"></section>
      <section id="s4" class="scene clip" data-start="20.7" data-duration="8.3" data-track-index="4" style="z-index:14"></section>
      <section id="s5" class="scene clip" data-start="28.6" data-duration="6.95" data-track-index="5" style="z-index:15"></section>
      <section id="s6" class="scene clip" data-start="34.95" data-duration="4.55" data-track-index="6" style="z-index:16"></section>
      <section id="s7" class="scene clip" data-start="38.95" data-duration="6.05" data-track-index="7" style="z-index:17"></section>

      <!-- le projecteur : un seul calque qui voyage d'une scène à l'autre -->
      <svg id="beam" style="z-index:44" viewBox="0 0 1080 1920"></svg>
      <div id="hero">
        <div id="hero-in">
          <div id="hero-glow"></div>
          <div id="hero-shadow"></div>
          <img id="hero-img" src="assets/projector.png" alt="Projecteur" />
          <svg id="hero-outline" viewBox="0 0 1094 748"></svg>
          <div id="lens-flare"><div class="flare-streak"></div><div class="flare-core"></div><div class="flare-star"></div></div>
        </div>
      </div>

      <canvas id="fx-front" class="fx" width="1080" height="1920" style="z-index:60"></canvas>
      <div id="tr" class="layer"></div>
      <div id="flash" class="layer" style="z-index:90"></div>
      <div id="vignette" class="layer" style="z-index:95"></div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="45" data-track-index="8" data-volume="1"></audio>
    </div>

    <script src="score.js"></script>
    <script src="assets/projector-data.js"></script>
    <script src="lib/fx.js"></script>
    <script>window.SCENES = [];</script>
    <script src="scenes/s1-accroche.js"></script>
    <script src="scenes/s2-produit.js"></script>
    <script src="scenes/s3-usages.js"></script>
    <script src="scenes/s4-fonctions.js"></script>
    <script src="scenes/s5-prix.js"></script>
    <script src="scenes/s6-livraison.js"></script>
    <script src="scenes/s7-cta.js"></script>
    <script src="main.js"></script>
    <script>
      // la timeline unique est enregistrée une fois tout construit (polices chargées)
      window.__buildFilm().then(function (film) {
        window.__timelines["main"] = film.tl;
        if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
      });
    </script>
  </body>
</html>
