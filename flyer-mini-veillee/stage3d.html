<!doctype html><html><head><meta charset="utf-8"><title>Stage 3D</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const S = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S, S); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.03).texture; scene.environmentIntensity = 0.55;
scene.fog = new THREE.Fog(0xe0c08f, 22, 80);
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 200); cam.position.set(0, 1.4, 10); cam.lookAt(0, 2.35, 0);

const tl = new THREE.TextureLoader();
const load = u => new Promise(r => tl.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));
const sky = await load('assets/sky.jpg');
const skyMesh = new THREE.Mesh(new THREE.PlaneGeometry(190, 42), new THREE.MeshBasicMaterial({ map: sky, fog: false, toneMapped: false }));
skyMesh.position.set(0, 21, -60); scene.add(skyMesh);

// ---- lights
scene.add(new THREE.AmbientLight(0xbfe6ee, 0.35));
const key = new THREE.DirectionalLight(0xffe6b8, 3.6); key.position.set(2, 6, 9); scene.add(key);
const back = new THREE.PointLight(0xffc27a, 380, 60, 2); back.position.set(0, 3.2, -14); scene.add(back);
const rimL = new THREE.PointLight(0x7fe6ff, 60, 30, 2); rimL.position.set(-7, 6, 4); scene.add(rimL);
const rimR = new THREE.PointLight(0x7fe6ff, 60, 30, 2); rimR.position.set(7, 6, 4); scene.add(rimR);

const fill = new THREE.PointLight(0xffffff, 90, 40, 2); fill.position.set(3.5, 2.5, 8); scene.add(fill);
const fill2 = new THREE.PointLight(0xffd9a0, 60, 40, 2); fill2.position.set(-4, 3, 7); scene.add(fill2);
// ---- floor: glossy sand, partly transparent so the crown reflection shows through
const fc = document.createElement('canvas'); fc.width = 1024; fc.height = 1024; const f = fc.getContext('2d');
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let g = f.createLinearGradient(0, 0, 0, 1024); g.addColorStop(0, '#caa06a'); g.addColorStop(1, '#8c5a26'); f.fillStyle = g; f.fillRect(0, 0, 1024, 1024);
for (let i = 0; i < 900; i++) { f.fillStyle = `rgba(${rnd() < .5 ? '255,226,170' : '120,70,25'},${.02 + rnd() * .035})`; f.fillRect(rnd() * 1024, rnd() * 1024, 20 + rnd() * 90, 1 + rnd() * 1.6); }
const floorTex = new THREE.CanvasTexture(fc); floorTex.colorSpace = THREE.SRGBColorSpace; floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(3, 5); floorTex.anisotropy = 8;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .32, metalness: .15, transparent: true, opacity: .8, envMapIntensity: 1.3 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -30); floor.renderOrder = 2; scene.add(floor);
const under = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ color: 0x8a5a28 }));
under.rotation.x = -Math.PI / 2; under.position.set(0, -2.5, -30); scene.add(under);

// ---- velvet curtains (pleats, gather towards the sides, teal -> gold below the tie-back)
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function curtain(sign) {
  const NX = 260, NY = 90, TOP = 11, GW = 8;
  const geo = new THREE.PlaneGeometry(1, 1, NX, NY), p = geo.attributes.position, col = new Float32Array(p.count * 3);
  const teal = new THREE.Color(0x0b6a7c), tealD = new THREE.Color(0x06404f), gold = new THREE.Color(0xb07c33), goldD = new THREE.Color(0x6a4318);
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) + .5, v = p.getY(i) + .5, y = v * TOP;
    const xin = 1.15 + 2.0 * smooth(9.5, 3.3, y) - 0.3 * smooth(2.6, 0, y);
    const x = xin + u * GW;
    const ph = u * 46 + Math.sin(y * .55) * .9 + Math.sin(y * 1.7 + u * 6) * .25;
    const z = -1.2 + 0.2 * Math.sin(ph) + 0.07 * Math.sin(ph * 2.7 + 1) + 0.18 * smooth(3.4, 8, y) * Math.sin(u * 5 + y * .3) - 0.5 * u;
    p.setXYZ(i, sign * x, y, z);
    const gl = smooth(3.8, 2.4, y), shade = .5 + .5 * Math.sin(ph);
    const c = teal.clone().lerp(tealD, 1 - shade * .8).lerp(gold.clone().lerp(goldD, 1 - shade * .8), gl);
    c.multiplyScalar(0.55 + .45 * Math.min(1, .55 + y / 8)); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
  const m = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: .7, metalness: 0, sheen: .55, sheenColor: new THREE.Color(0x7fd6e0), sheenRoughness: .55, side: THREE.DoubleSide, envMapIntensity: .6 });
  const mesh = new THREE.Mesh(geo, m); scene.add(mesh);
}
curtain(-1); curtain(1);

// ---- golden crown (parametric body with 5 scalloped fleur points + band + rubies), mirrored under the glossy floor
const gold = new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 1, roughness: .2, envMapIntensity: 2.2 });
const goldDark = new THREE.MeshStandardMaterial({ color: 0xd69a1c, metalness: 1, roughness: .32, envMapIntensity: 1.8 });
const ruby = new THREE.MeshPhysicalMaterial({ color: 0xc80f1c, metalness: 0, roughness: .08, clearcoat: 1, transmission: 0, emissive: 0x4a0006, emissiveIntensity: .5, envMapIntensity: 2 });
function crown() {
  const grp = new THREE.Group(); const R = 1, N = 5;
  const H = th => { const s = Math.pow(.5 + .5 * Math.cos(N * th), 2.4); return .56 + .78 * s; };
  const SEG = 360, V = 18; const pos = [], idx = [];
  for (let j = 0; j <= SEG; j++) { const th = j / SEG * Math.PI * 2;
    for (let k = 0; k <= V; k++) { const v = k / V, r = R * (1 + .09 * v) - .015 * Math.sin(v * Math.PI);
      pos.push(Math.sin(th) * r, .26 + v * (H(th) - .26), Math.cos(th) * r); } }
  for (let j = 0; j < SEG; j++) for (let k = 0; k < V; k++) { const a = j * (V + 1) + k, b = a + V + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); bg.setIndex(idx); bg.computeVertexNormals();
  const body = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ color: 0xffd04e, metalness: 1, roughness: .2, envMapIntensity: 3, side: THREE.DoubleSide })); grp.add(body);
  // band
  const band = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.015, R * .985, .3, 96, 1, true), new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 1, roughness: .18, envMapIntensity: 2.4, side: THREE.DoubleSide })); band.position.y = .15; grp.add(band);
  for (const y of [0, .3]) { const t = new THREE.Mesh(new THREE.TorusGeometry(R * 1.0, .035, 14, 120), goldDark); t.rotation.x = Math.PI / 2; t.position.y = y; grp.add(t); }
  // top rim along the scalloped edge
  const rimPts = []; for (let j = 0; j <= 400; j++) { const th = j / 400 * Math.PI * 2; rimPts.push(new THREE.Vector3(Math.sin(th) * R * 1.09, H(th), Math.cos(th) * R * 1.09)); }
  grp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPts, true), 800, .03, 8, true), goldDark));
  // fleur balls + rubies on the points
  for (let i = 0; i < N; i++) { const th = i * Math.PI * 2 / N; const hx = Math.sin(th) * R * 1.09, hz = Math.cos(th) * R * 1.09;
    const ball = new THREE.Mesh(new THREE.SphereGeometry(.085, 24, 16), gold); ball.position.set(hx, H(th) + .07, hz); grp.add(ball);
    const gem = new THREE.Mesh(new THREE.SphereGeometry(.05, 20, 14), ruby); gem.position.set(Math.sin(th) * R * 1.1, H(th) - .22, Math.cos(th) * R * 1.1); grp.add(gem); }
  // rubies + studs on the band
  for (let i = 0; i < 10; i++) { const th = (i + .5) / 10 * Math.PI * 2; const g2 = new THREE.Mesh(new THREE.SphereGeometry(.058, 22, 16), ruby); g2.scale.set(1, 1, .6); g2.position.set(Math.sin(th) * R * 1.03, .15, Math.cos(th) * R * 1.03); grp.add(g2);
    const st = new THREE.Mesh(new THREE.SphereGeometry(.022, 10, 8), gold); st.position.set(Math.sin(th + .16) * R * 1.02, .27, Math.cos(th + .16) * R * 1.02); grp.add(st); }
  return grp;
}
const c1 = crown(); c1.scale.setScalar(.7); c1.position.set(0, 0.01, 2.6); c1.rotation.set(.06, -Math.PI / 5 * 0, 0); scene.add(c1);
const c2 = crown(); c2.scale.set(.7, -.7, .7); c2.position.set(0, -0.01, 2.6); c2.rotation.set(-.06, 0, 0); scene.add(c2);
// glow on the floor around the crown
const gc = document.createElement('canvas'); gc.width = gc.height = 256; const gx = gc.getContext('2d'); const rg = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
rg.addColorStop(0, 'rgba(255,236,190,.95)'); rg.addColorStop(.35, 'rgba(255,214,140,.4)'); rg.addColorStop(1, 'rgba(255,200,120,0)'); gx.fillStyle = rg; gx.fillRect(0, 0, 256, 256);
const glow = new THREE.Mesh(new THREE.PlaneGeometry(9, 5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
glow.rotation.x = -Math.PI / 2; glow.position.set(0, .03, 2.4); glow.renderOrder = 3; scene.add(glow);

renderer.render(scene, cam);
window.ready = true;
</script></body></html>
