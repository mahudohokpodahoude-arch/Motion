    <div style="font-weight:700;font-size:19px;color:var(--or);line-height:40px">Rue de Golf-FM, Cotonou</div>
  </div>

  <!-- couronne + reflet -->

    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#a86d10"/><stop offset=".16" stop-color="#f1cf5e"/><stop offset=".4" stop-color="#fff2b0"/><stop offset=".6" stop-color="#e0a82a"/><stop offset=".85" stop-color="#f3d36a"/><stop offset="1" stop-color="#9c620c"/></linearGradient>
      <linearGradient id="gv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#3a1d00" stop-opacity=".28"/></linearGradient>
      <radialGradient id="ruby"><stop offset="0" stop-color="#ff8c8c"/><stop offset=".55" stop-color="#d4141e"/><stop offset="1" stop-color="#790510"/></radialGradient>
      <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="172" y2="262"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="m" maskUnits="userSpaceOnUse" x="0" y="172" width="280" height="90"><rect x="0" y="172" width="280" height="90" fill="url(#fade)"/></mask>
      <g id="crown">
        <path d="M14 152 L6 16 C20 80 40 116 72 116 C104 116 118 76 128 40 L140 2 L152 40 C162 76 176 116 208 116 C240 116 260 80 274 16 L266 152 Z" fill="url(#g)"/>
        <path d="M14 152 L6 16 C20 80 40 116 72 116 C104 116 118 76 128 40 L140 2 L152 40 C162 76 176 116 208 116 C240 116 260 80 274 16 L266 152 Z" fill="url(#gv)"/>
        <path d="M40 112 C52 124 90 124 106 100 M240 112 C228 124 190 124 174 100" stroke="#8a5a0e" stroke-width="3" fill="none" opacity=".55"/>
        <circle cx="6" cy="12" r="7" fill="url(#g)"/><circle cx="274" cy="12" r="7" fill="url(#g)"/>
        <circle cx="140" cy="8" r="8" fill="url(#g)"/><path d="M140 -6v10M135 -1h10" stroke="#fff3b0" stroke-width="3" stroke-linecap="round"/>
        <rect x="8" y="130" width="264" height="42" rx="10" fill="url(#g)"/><rect x="8" y="130" width="264" height="42" rx="10" fill="url(#gv)"/>
        <rect x="8" y="130" width="264" height="5" rx="2.5" fill="#fff8d0" opacity=".75"/><rect x="8" y="166" width="264" height="5" rx="2.5" fill="#7a4a08" opacity=".35"/>
        <circle cx="140" cy="44" r="7" fill="url(#ruby)"/>
        <circle cx="42" cy="151" r="8" fill="url(#ruby)"/><circle cx="91" cy="151" r="8" fill="url(#ruby)"/><circle cx="140" cy="151" r="8" fill="url(#ruby)"/><circle cx="189" cy="151" r="8" fill="url(#ruby)"/><circle cx="238" cy="151" r="8" fill="url(#ruby)"/>
      </g>
    </defs>
    <g mask="url(#m)"><use href="#crown" transform="translate(0,344) scale(1,-1)"/></g>
    <use href="#crown"/>
  </svg>

  <!-- photo de l'apôtre -->
  <div class="abs" id="ph" style="left:776px;top:648px;width:196px;height:292px;border-radius:26px;background:url(assets/amos_tall.jpg) center top/cover;box-shadow:0 0 0 4px rgba(255,255,255,.8),0 14px 34px rgba(30,15,0,.5)"></div>
  <div class="abs ora" style="left:776px;top:952px;width:196px;height:62px;border-radius:20px;text-align:center">
    <div style="font-weight:600;font-size:15px;letter-spacing:.14em;margin-top:9px">APÔTRE</div>
    <div style="font-weight:800;font-size:25px;margin-top:3px;letter-spacing:.01em">AMOS ELITE</div>
  </div>

  <!-- pied de page de la Zone -->
  <div class="abs" style="left:0;top:1022px;width:1080px;height:58px;background:linear-gradient(180deg,rgba(40,20,5,.82),rgba(25,10,0,.95))"></div>
  <div class="abs" style="left:0;width:1080px;top:1029px;text-align:center;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em">ZONE 242 · SIKÈCODJI · RUE DE GOLF-FM, COTONOU</div>
  <div class="abs" style="left:0;width:1080px;top:1052px;display:flex;justify-content:center;align-items:center;gap:16px;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px">
    <span style="display:inline-flex;align-items:center;gap:7px"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.35 2.3.55 3.6.55a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.55 3.6a1 1 0 0 1-.25 1z" fill="#ffb36b"/></svg>01 41 62 77 77</span>
    <span style="opacity:.5">|</span>
    <svg width="13" height="15" viewBox="0 0 12 14"><path d="M8 0v9.2a3 3 0 1 1-3-3v2a1 1 0 1 0 1 1V0z M8 0c.2 1.6 1.4 2.8 3.2 3v2c-1.2 0-2.2-.4-3.2-1z" fill="#fff"/></svg>
    <svg width="19" height="14" viewBox="0 0 15 11"><rect width="15" height="11" rx="3" fill="#fff"/><path d="M6 3l4 2.5L6 8z" fill="#3a1c00"/></svg>
    <svg width="15" height="15" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="6" cy="6" r="2.2" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
    <svg width="9" height="16" viewBox="0 0 8 14"><path d="M5.2 14V7.7h2.1l.3-2.5H5.2V3.7c0-.7.2-1.2 1.2-1.2H7.7V.3C7.5.3 6.7.2 5.8.2 3.9.2 2.7 1.3 2.7 3.4v1.8H.6v2.5h2.1V14z" fill="#fff"/></svg>
    <span>ZONE 242</span>
  </div>
</div>
<script>
// ---------- procedural stage: sky, curtains, golden floor ----------
const cv=document.getElementById('bg'),c=cv.getContext('2d');
const rnd=(()=>{let s=9;return()=>(s=(s*16807)%2147483647)/2147483647})();
function curtain(flip){
  c.save(); if(flip){c.translate(1080,0);c.scale(-1,1);}
  const path=new Path2D(); path.moveTo(-30,-30);path.lineTo(300,-30);path.bezierCurveTo(272,110,214,250,200,380);path.bezierCurveTo(190,470,150,560,142,720);path.lineTo(-30,720);path.closePath();
  c.fillStyle='#0d6677';c.fill(path);c.save();c.clip(path);
  for(let x=-30;x<310;x+=5){const a=Math.sin(x*.075)+.6*Math.sin(x*.19+1.3);
    c.fillStyle=`rgba(0,25,40,${Math.max(0,a)*.17})`;c.fillRect(x,-30,5,780);
    c.fillStyle=`rgba(190,245,240,${Math.max(0,-a)*.10})`;c.fillRect(x,-30,5,780);}
  let g=c.createLinearGradient(0,330,0,640);g.addColorStop(0,'rgba(166,106,44,0)');g.addColorStop(1,'rgba(168,108,46,.9)');c.fillStyle=g;c.fillRect(-30,330,360,420);
  g=c.createLinearGradient(0,-30,0,200);g.addColorStop(0,'rgba(0,20,35,.45)');g.addColorStop(1,'rgba(0,20,35,0)');c.fillStyle=g;c.fillRect(-30,-30,360,230);
  c.restore();
  c.save();c.strokeStyle='rgba(215,250,245,.55)';c.lineWidth=3;c.shadowColor='rgba(255,255,255,.6)';c.shadowBlur=8;c.beginPath();c.moveTo(300,-30);c.bezierCurveTo(272,110,214,250,200,380);c.bezierCurveTo(190,470,150,560,142,720);c.stroke();c.restore();
  // tie-back cord
  c.strokeStyle='#d9a24a';c.lineWidth=5;c.beginPath();c.moveTo(150,520);c.quadraticCurveTo(175,560,160,640);c.stroke();
  c.fillStyle='#e8b95a';c.beginPath();c.ellipse(158,650,9,18,0,0,7);c.fill();
  c.restore();
}
function stage(){
  let g=c.createLinearGradient(0,0,0,700);
  g.addColorStop(0,'#0a4a62');g.addColorStop(.22,'#17808f');g.addColorStop(.42,'#4cb0b4');g.addColorStop(.58,'#b7d3c3');g.addColorStop(.7,'#e6cf9f');g.addColorStop(1,'#d9b27a');
  c.fillStyle=g;c.fillRect(0,0,1080,700);
  // clouds
  c.filter='blur(34px)';
  for(let i=0;i<22;i++){const x=200+rnd()*680,y=210+rnd()*400,rx=70+rnd()*150,ry=26+rnd()*50;c.fillStyle=`rgba(255,244,222,${.1+rnd()*.17})`;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();}
  c.filter='none';
  g=c.createRadialGradient(540,650,0,540,650,420);g.addColorStop(0,'rgba(255,238,205,.75)');g.addColorStop(1,'rgba(255,238,205,0)');c.fillStyle=g;c.fillRect(0,230,1080,520);
  // golden floor
  g=c.createLinearGradient(0,680,0,1080);g.addColorStop(0,'#d9b27a');g.addColorStop(.3,'#c08c4c');g.addColorStop(.7,'#8d5a26');g.addColorStop(1,'#4a2a0d');c.fillStyle=g;c.fillRect(0,680,1080,400);
  for(let y=700;y<1080;y+=7){c.fillStyle=`rgba(255,225,170,${.03+rnd()*.06})`;c.fillRect(120+rnd()*100,y,500+rnd()*400,1.4);}
  g=c.createRadialGradient(540,985,0,540,985,330);g.addColorStop(0,'rgba(255,236,190,.65)');g.addColorStop(1,'rgba(255,236,190,0)');c.fillStyle=g;c.fillRect(0,700,1080,380);
  curtain(false);curtain(true);
  g=c.createRadialGradient(540,540,420,540,540,820);g.addColorStop(0,'rgba(0,25,40,0)');g.addColorStop(1,'rgba(0,25,40,.38)');c.fillStyle=g;c.fillRect(0,0,1080,1080);
  const id=c.getImageData(0,0,1080,1080),d=id.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*9;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}c.putImageData(id,0,0);
}
stage();
window.ready=(async()=>{
  await Promise.all(['100px Bebas','500 20px Poppins','700 20px Poppins','800 20px Poppins','700 20px Montserrat'].map(f=>document.fonts.load(f)));await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  await new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src='assets/amos_tall.jpg'});
})();
</script></body></html>
