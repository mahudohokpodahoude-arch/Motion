<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Invite une amie · conversation · Week-end Zone Women</title>
    <script src="gsap/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/bebas-neue-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #efeae2; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Mont", sans-serif; color: #111b21; background: #efeae2; }
      .abs { position: absolute; }
      /* papier peint de la discussion */
      #wall { left: 0; top: 260px; width: 1080px; height: 1500px; background-color: #efeae2;
        background-image: radial-gradient(rgba(0,0,0,.045) 2px, transparent 2.5px), radial-gradient(rgba(0,0,0,.035) 2px, transparent 2.5px); background-size: 46px 46px, 46px 46px; background-position: 0 0, 23px 23px; }
      #sb { left: 0; top: 0; width: 1080px; height: 86px; background: #0b5d52; color: #fff; font-weight: 800; font-size: 34px; }
      #sb .tm { left: 54px; top: 22px; } #sb .bt { right: 54px; top: 26px; width: 58px; height: 30px; border: 3px solid #fff; border-radius: 8px; } #sb .bt i { position: absolute; left: 4px; top: 4px; width: 38px; height: 16px; background: #fff; border-radius: 3px; display: block; }
      #hd { left: 0; top: 86px; width: 1080px; height: 174px; background: #0b5d52; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
      #hd .bk { left: 36px; top: 62px; width: 44px; height: 44px; } #hd .bk svg { width: 44px; height: 44px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #av { left: 104px; top: 30px; width: 112px; height: 112px; border-radius: 50%; background: linear-gradient(145deg, #f5541a, #ee1a02); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 54px; }
      #nm { left: 240px; top: 36px; font-weight: 800; font-size: 46px; line-height: 1.1; }
      #st { left: 240px; top: 92px; font-weight: 600; font-size: 30px; color: #cfe9e4; }
      #ic { right: 44px; top: 56px; display: flex; gap: 54px; } #ic svg { width: 44px; height: 44px; stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #day { left: 50%; top: 20px; transform: translateX(-50%); background: #e1f2fb; color: #3b5360; font-weight: 800; font-size: 26px; letter-spacing: .08em; padding: 10px 26px; border-radius: 14px; box-shadow: 0 2px 4px rgba(0,0,0,.12); }
      #clip { left: 0; top: 260px; width: 1080px; height: 1340px; overflow: hidden; }
      #chat { left: 0; top: 0; width: 1080px; }
      .m { position: absolute; width: max-content; max-width: 840px; padding: 20px 28px 14px; border-radius: 30px; font-size: 42px; line-height: 56px; font-weight: 600; box-shadow: 0 2px 3px rgba(0,0,0,.15); opacity: 0; transform-origin: 100% 100%; }
      .m.me { background: #d9fdd3; right: 36px; border-bottom-right-radius: 8px; }
      .m.her { background: #fff; left: 36px; border-bottom-left-radius: 8px; transform-origin: 0 100%; }
      .m .l { white-space: nowrap; }
      .m .ft { height: 32px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 24px; font-weight: 600; color: #667781; }
      .m .ft svg { width: 34px; height: 22px; fill: none; stroke: #8696a0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      #cp { left: 0; top: 1600px; width: 1080px; height: 170px; background: #f0f2f5; }
      #in { left: 30px; top: 28px; width: 840px; height: 108px; background: #fff; border-radius: 54px; display: flex; align-items: center; padding: 0 34px; font-size: 38px; font-weight: 600; color: #111b21; white-space: nowrap; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
      #in .ph { color: #8696a0; }
      #sd { left: 890px; top: 28px; width: 108px; height: 108px; border-radius: 50%; background: #0b8a6f; display: flex; align-items: center; justify-content: center; } #sd svg { width: 50px; height: 50px; stroke: #fff; fill: #fff; stroke-width: 1; }
      #end { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(160deg, #ee1a02 0%, #f12e04 40%, #f5541a 80%, #fb7a2a 100%); transform: translateY(100%); }
      #flash { inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29.6" data-width="1080" data-height="1920">
      <div id="wall" class="abs"></div>
      <div id="clip" class="abs"><div id="chat" class="abs"></div></div>
            <div id="hd" class="abs">
        <div class="bk abs"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></div>
        <div id="av" class="abs">N</div><div id="nm" class="abs">Nadège</div><div id="st" class="abs">en ligne</div>
        <div id="ic" class="abs"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
      </div>
      <div id="sb" class="abs"><div class="tm abs">14:32</div><div class="bt abs"><i></i></div></div>
      <div id="cp" class="abs"><div id="in" class="abs"><span class="ph">Message</span></div><div id="sd" class="abs"><svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></div></div>
      <div id="end" class="abs"></div>
      <div id="flash" class="abs"></div>
      <audio id="snd" src="assets/musique.mp3" data-start="0" data-duration="29.6" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const END = 29.6, TEND = 26.2;
      // [qui, instant d'apparition, instant de début de frappe, lignes, heure]
      const M = [
        ["me", 2.0, 1.1, ["Nadège, j'en ai marre 😩", "Mon salaire est fini avant", "la fin du mois."], "14:32"],
        ["her", 4.6, 3.4, ["Je te comprends…", "Tu arrives à mettre", "un peu de côté ?"], "14:32"],
        ["me", 7.4, 6.5, ["Jamais. Je ne sais même", "pas par où commencer 🙈"], "14:33"],
        ["her", 10.6, 9.2, ["Le samedi 28, au WEEK-END", "ZONE WOMEN, il y a un panel", "« Femme, foi et finances »", "à 15h00."], "14:33"],
        ["me", 14.0, 13.3, ["Ah bon ? C'est où ?"], "14:34"],
        ["her", 16.6, 15.3, ["Zone 242, Sikècodji.", "C'est gratuit, mais il faut", "s'inscrire : les places", "sont limitées."], "14:34"],
        ["me", 20.6, 19.8, ["Je m'inscris maintenant 🙏"], "14:35"],
        ["her", 23.0, 21.8, ["On y va ensemble ?", "Je t'envoie le lien 🔗"], "14:35"],
      ];
      const chat = $("#chat"); chat.insertAdjacentHTML("beforeend", '<div id="day" class="abs">AUJOURD\'HUI</div>'); const TICK = '<svg viewBox="0 0 34 22"><path d="M2 12l6 6L22 3"/><path d="M13 16l3 3L31 3"/></svg>';
      const POS = []; let y = 100; const GAP = 22;
      M.forEach(([who, t, tt, lines, hm], i) => {
        const h = 20 + lines.length * 56 + 32 + 14;
        POS.push({ top: y, h });
        chat.insertAdjacentHTML("beforeend", `<div class="m ${who}" id="m${i}" style="top:${y}px">${lines.map((l) => `<div class="l">${l}</div>`).join("")}<div class="ft">${hm}${who === "me" ? TICK : ""}</div></div>`);
        y += h + GAP;
      });
      const VIEW = 1340, BOT = 24;
      const tl = gsap.timeline({ paused: true });
      gsap.set(".m", { opacity: 0, scale: .85, y: 20 });
      M.forEach(([who, t, tt, lines, hm], i) => {
        const m = $("#m" + i), bottom = POS[i].top + POS[i].h;
        const need = Math.min(0, VIEW - BOT - bottom);
        tl.to(m, { opacity: 1, scale: 1, y: 0, duration: .3, ease: "back.out(2)" }, t);
        tl.to("#chat", { y: need, duration: .4, ease: "power3.out" }, t);
        if (who === "me") {
          // frappe dans la barre de message, puis envoi
          const txt = lines.join(" "); const o = { v: 0 };
          tl.set("#in", { innerHTML: "" }, tt - .01);
          tl.to(o, { v: txt.length, duration: Math.max(.5, t - tt - .15), ease: "none", onUpdate: () => { $("#in").textContent = [...txt].slice(0, Math.round(o.v)).join(""); } }, tt);
          tl.set("#in", { innerHTML: '<span class="ph">Message</span>' }, t);
          tl.to("#sd", { scale: .88, duration: .08, yoyo: true, repeat: 1 }, t - .12);
          // coches : grises à l'envoi, bleues quand l'autre répond
          const nxt = M[i + 1]; if (nxt) tl.set(m.querySelector(".ft svg"), { stroke: "#53bdeb" }, nxt[1]);
        } else {
          tl.set("#st", { textContent: "écrit…" }, tt); tl.set("#st", { textContent: "en ligne" }, t);
        }
      });
      // les derniers messages sont lus
      tl.set($("#m6").querySelector(".ft svg"), { stroke: "#53bdeb" }, 24.0);
      // écran final
      const endEl = $("#end");
      endEl.innerHTML = `
        <div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#ff7a33;opacity:.18;clip-path:polygon(0 0,22% 0,8% 100%,0 100%)"></div>
        <div class="abs" style="left:0;top:0;width:1080px;height:1920px;background:#b80f00;opacity:.2;clip-path:polygon(38% 0,52% 0,34% 100%,20% 100%)"></div>
        <div id="e1" class="abs" style="left:50%;top:300px;background:#121212;color:#fff;font-weight:800;font-size:36px;letter-spacing:.08em;padding:18px 34px;border-radius:14px;white-space:nowrap;transform:translateX(-50%) rotate(-3deg)">FEMME, FOI ET FINANCES · SAMEDI 15H00</div>
        <div id="e2" class="abs" style="left:0;width:1080px;top:430px;text-align:center;font-family:Bebas,sans-serif;font-size:330px;line-height:.86;color:#fff;text-shadow:12px 12px 0 #0a2b4a;letter-spacing:.01em"><div>INVITE</div><div>UNE AMIE</div></div>
        <img id="e3" class="abs" src="assets/lockup.png" style="left:290px;top:1080px;width:500px;filter:drop-shadow(0 0 18px rgba(255,255,255,.5))" alt="">
        <div id="e4" class="abs" style="left:0;width:1080px;top:1400px;text-align:center;font-weight:800;font-size:40px;letter-spacing:.12em;line-height:1.4;color:#ffe3cf">27–29 NOVEMBRE · ZONE 242<br>SIKÈCODJI · GRATUIT · 150 PLACES</div>
        <div id="e5" class="abs" style="left:50%;top:1550px;background:#fff;color:#d8300a;font-weight:800;font-size:42px;letter-spacing:.06em;padding:22px 44px;border-radius:16px;white-space:nowrap;transform:translateX(-50%)">INSCRIPTION : LIEN EN BIO</div>`;
      tl.fromTo("#end", { y: 1920 }, { y: 0, duration: .55, ease: "power4.out" }, TEND);
      tl.fromTo("#flash", { opacity: .3 }, { opacity: 0, duration: .3, ease: "power2.out", immediateRender: false }, TEND + .2);
      tl.fromTo("#e1", { scale: 0, rotation: -14 }, { scale: 1, rotation: -3, duration: .5, ease: "back.out(2.2)" }, TEND + .5);
      tl.fromTo("#e2 div", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: .5, ease: "power4.out", stagger: .15 }, TEND + .7);
      tl.fromTo("#e3", { scale: .8, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: "back.out(1.8)" }, TEND + 1.3);
      tl.fromTo("#e4", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: "power3.out" }, TEND + 1.6);
      tl.fromTo("#e5", { scale: 0 }, { scale: 1, duration: .5, ease: "back.out(2.4)" }, TEND + 2.0);
            window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
