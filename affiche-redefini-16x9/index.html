<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Redéfini par le Père · 1920×1080</title>
<style>

html,body{margin:0;background:#000}
#s{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:Barlow,sans-serif;

.a{position:absolute;white-space:nowrap;line-height:1}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
#hero{left:470px;top:372px;width:1459px;height:640px;filter:drop-shadow(0 0 40px rgba(60,140,255,.35))}

  </div>
  <div class="a" style="left:96px;top:928px;display:flex;align-items:center;gap:20px;font-weight:600;font-style:italic;font-size:44px"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z" fill="#2cc4ff"/></svg><span>avec l'<b style="color:var(--or);font-weight:700">Apôtre Amos</b></span></div>

  <div class="a" style="left:230px;top:1012px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:34px"><svg width="26" height="30" viewBox="0 0 24 28"><path d="M12 0C6 0 1.5 4.6 1.5 10.3 1.5 18 12 28 12 28s10.5-10 10.5-17.7C22.500 4.600 18 0 12 0z" fill="#2cc4ff"/><circle cx="12" cy="10" r="4" fill="#041030"/></svg>Zone 242 – Sikècodji, rue de Golf-FM</div>

</div>
<script>
// subtle film grain
(()=>{const c=document.getElementById('grain').getContext('2d'),id=c.createImageData(1920,1080);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}c.putImageData(id,0,0)})();
window.ready=(async()=>{await Promise.all(['100px Anton','100px Yellowtail','500 20px Barlow','600 20px Barlow','700 20px Barlow'].map(f=>document.fonts.load(f)));await document.fonts.ready;
 await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
 // fit "PAR LE PÈRE" to the left/centre column width
 const t=document.getElementById('t2');t.style.display='inline-block';const w=t.getBoundingClientRect().width;t.style.fontSize=(262*1130/w).toFixed(1)+'px';t.style.display='';})();
</script></body></html>
