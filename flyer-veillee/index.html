<style>

<script>
window.ready=(async()=>{
  await Promise.all(['100px Bebas','300 20px Josefin','500 20px Montserrat','700 20px Montserrat','800 20px Montserrat'].map(f=>document.fonts.load(f)));await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  // fit each title line to the model's widths (~ 63% / 82% of the page)
  for(const [id,w] of [['t1',480],['t2',640]]){const el=document.getElementById(id);el.style.display='inline-block';el.style.left='0';
    let fs=parseFloat(el.style.fontSize);const cur=el.getBoundingClientRect().width;el.style.fontSize=(fs*w/cur).toFixed(1)+'px';el.style.display='';}
})();
</script></body></html>
