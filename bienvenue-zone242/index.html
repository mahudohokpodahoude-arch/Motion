<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style><style>@font-face{font-family:Montserrat;font-weight:800;src:url(/fonts/montserrat-latin-800-normal.woff2)}@font-face{font-family:Montserrat;font-weight:500;src:url(/fonts/montserrat-latin-500-normal.woff2)}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,cv=document.getElementById('c'),g=cv.getContext('2d');
const DUR=20;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const win=(t,a,b)=>sm((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const parts=Array.from({length:70},()=>({x:rnd()*W,y:rnd()*H,r:2+rnd()*9,sp:6+rnd()*22,ph:rnd()*6.28,c:rnd()<.6?'255,150,70':'200,150,255',a:.15+rnd()*.5}));

// Catmull-Rom sampling
function spline(P,n=160){const out=[];const m=P.length-1;
  for(let i=0;i<=n;i++){const u=i/n*m,k=Math.min(m-1,Math.floor(u)),f=u-k;
    const p0=P[Math.max(0,k-1)],p1=P[k],p2=P[k+1],p3=P[Math.min(m,k+2)];
    const f2=f*f,f3=f2*f,q=(a,b,c,d)=>.5*(2*b+(-a+c)*f+(2*a-5*b+4*c-d)*f2+(-a+3*b-3*c+d)*f3);
    out.push([q(p0[0],p1[0],p2[0],p3[0]),q(p0[1],p1[1],p2[1],p3[1])]);}
  return out;}
// tapered ribbon between u=a..b of path
function ribbon(P,a,b,wid,cols,alpha,blur,taper=1){
  if(b-a<.01||alpha<=0)return;const S=spline(P),n=S.length-1;
  const i0=Math.floor(a*n),i1=Math.ceil(b*n);const L=[],R=[];
  for(let i=i0;i<=i1;i++){const p=S[i],q=S[Math.min(n,i+1)],o=S[Math.max(0,i-1)];
    let dx=q[0]-o[0],dy=q[1]-o[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const k=clamp((i/n-a)/(b-a)),w=wid*Math.pow(Math.sin(Math.PI*k),taper)*.5+.4;
    L.push([p[0]-dy*w,p[1]+dx*w]);R.push([p[0]+dy*w,p[1]-dx*w]);}
  const s=S[i0],e=S[i1];const gr=g.createLinearGradient(s[0],s[1],e[0],e[1]);
  cols.forEach((c,i)=>gr.addColorStop(i/(cols.length-1),c));
  g.save();g.globalAlpha=alpha;g.globalCompositeOperation='lighter';g.filter=`blur(${blur}px)`;
  g.beginPath();L.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
  for(let i=R.length-1;i>=0;i--)g.lineTo(R[i][0],R[i][1]);g.closePath();g.fillStyle=gr;g.fill();g.restore();}
function glowRibbon(P,a,b,wid,cols,alpha,taper){
  ribbon(P,a,b,wid*2.6,cols,alpha*.4,wid*.7,taper);
  ribbon(P,a,b,wid*1.3,cols,alpha*.75,wid*.25,taper);
  ribbon(P,a,b,wid*.3,['#b9d8ff','#e8f6ff','#b9d8ff'],alpha*.35,3,taper);}

const CYA=['#7a3cff','#c050ff','#ff5fd0','#6a7dff','#2ec9ff','#e8fbff'];
const BLU=['#5a2cff','#3d6bff','#2ec9ff','#9be4ff'];
const VIO=['#ff6ad5','#a05cff','#5b6cff','#37c8ff'];

function bg(t){
  const k=win(t,6,10);
  const gr=g.createLinearGradient(0,H,W,0);
  gr.addColorStop(0,'#03002a');gr.addColorStop(.5,`rgb(${lerp(6,24,k)},${lerp(2,12,k)},${lerp(52,110,k)})`);
  gr.addColorStop(1,`rgb(${lerp(10,52,k)},${lerp(4,26,k)},${lerp(80,170,k)})`);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // faint grid
  g.globalAlpha=.05*(1-k);g.strokeStyle='#8070ff';g.lineWidth=1;
  for(let x=0;x<W;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  g.globalAlpha=1;
  const v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.75);v.addColorStop(0,'rgba(0,0,20,0)');v.addColorStop(1,'rgba(0,0,15,.55)');
  g.fillStyle=v;g.fillRect(0,0,W,H);}

function text(str,cx,cy,size,t,t0,t1,col,stagger=.09){
  g.save();g.font=`${size}px "Liberation Serif","Times New Roman",serif`;g.textBaseline='middle';
  const sp=size*.24;const ws=[...str].map(ch=>g.measureText(ch).width+sp);
  const tot=ws.reduce((a,b)=>a+b,0)-sp;let x=cx-tot/2;
  [...str].forEach((ch,i)=>{
    const a=win(t,t0+i*stagger,t0+i*stagger+.7)*(1-win(t,t1+i*.03,t1+.6+i*.03));
    if(a>0){g.globalAlpha=a;g.filter=`blur(${(1-a)*8}px)`;g.fillStyle=col;g.shadowColor='rgba(150,110,255,.8)';g.shadowBlur=18;
      g.fillText(ch,x,cy+(1-a)*10);}
    x+=ws[i];});
  g.restore();}

function symbol(cx,cy,s,alpha,shimmer){
  // geometry from official symbol, centred (units: 1 = 1000)
  const u=s/1000,ox=cx-482*u,oy=cy-482*u;
  const br=[[0,0,371,124],[0,0,124,371],[594,0,371,124],[841,0,124,371],[0,594,124,371],[0,841,371,124],[841,594,124,371],[594,841,371,124]];
  g.save();g.globalAlpha=alpha;
  const gr=g.createLinearGradient(cx-s*.5,cy-s*.5,cx+s*.5,cy+s*.5);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(clamp(shimmer-.15),'#c8d2f0');gr.addColorStop(clamp(shimmer),'#ffffff');gr.addColorStop(clamp(shimmer+.15),'#a9b4e6');gr.addColorStop(1,'#e6ebff');
  g.fillStyle=gr;g.shadowColor='rgba(120,140,255,.7)';g.shadowBlur=30*u*3;
  br.forEach(([x,y,w,h])=>g.fillRect(ox+x*u,oy+y*u,w*u,h*u));
  g.fillStyle='#ff5a36';g.shadowColor='rgba(255,90,54,.8)';g.shadowBlur=40*u*3;
  g.fillRect(ox+372*u,oy+372*u,223*u,223*u);
  g.restore();}

function particles(t,a){
  g.save();g.globalCompositeOperation='lighter';
  for(const p of parts){const y=((p.y-p.sp*t)%H+H)%H,x=p.x+Math.sin(t*.4+p.ph)*20;
    const tw=.6+.4*Math.sin(t*1.7+p.ph);
    g.filter=`blur(${p.r>6?5:1.5}px)`;g.fillStyle=`rgba(${p.c},${p.a*tw*a})`;g.beginPath();g.arc(x,y,p.r,0,7);g.fill();}
  g.restore();}

// ---------- paths
const loopPath=t=>{const d=Math.sin(t*.7)*18,e=Math.cos(t*.5)*14;
  return[[W*1.08,H*.22+e],[W*.80,H*.40+d],[W*.58,H*.62+e],[W*.36,H*.74+d],[W*.16,H*.64+e],[W*.12,H*.46+d],[W*.26,H*.35+e],[W*.46,H*.40+d],[W*.66,H*.56+e],[W*.92,H*.62+d]]};
const sweepA=t=>{const d=Math.sin(t*.8)*25;return[[-W*.1,H*.60+d],[W*.2,H*.74],[W*.5,H*.80+d],[W*.8,H*.9],[W*1.1,H*1.05]]};
const sweepB=t=>{const d=Math.cos(t*.6)*25;return[[-W*.1,H*.46+d],[W*.25,H*.60],[W*.55,H*.66+d],[W*.85,H*.82],[W*1.1,H*.98]]};

function scene(t){
  bg(t);
  // --- scene 1 : BIENVENUE
  if(t<5.4){
    const a=win(t,.2,2.4),b=win(t,2.9,4.6);
    glowRibbon(loopPath(t),b*.75,a,70,CYA,1-win(t,4.4,5.2));
    glowRibbon(loopPath(t+1.3).map(p=>[p[0]+30,p[1]-20]),b*.7,a*.9,34,VIO,.6*(1-win(t,4.4,5.2)));
    text('BIENVENUE',W*.5,H*.50,112,t,.5,4.1,'#ffffff');
  }
  // --- scene 2 : À LA
  if(t>4.6&&t<8.8){
    const k=win(t,4.8,6.4),o=1-win(t,7.6,8.6);
    glowRibbon(sweepA(t),0,k,90,BLU,o*.95);
    glowRibbon(sweepB(t),0,k*.95,50,VIO,o*.8);
    glowRibbon(sweepB(t+2).map(p=>[p[0],p[1]-80]),.05,k*.8,30,BLU,o*.6);
    const y=lerp(H*.40,H*.56,win(t,5.2,7.6));
    text('À LA',W*.5,y,112,t,5.1,7.3,'#ffffff',.12);
  }
  // --- scene 3 : logo
  if(t>7.6){
    const z=1-win(t,8.0,10.4);
    const a=win(t,7.7,8.2),gm=win(t,9.2,10.6);
    const hh=lerp(720,720*2.2,Math.pow(z,2.2)),ww=hh*LW.width/LW.height;
    const cy=H*.5;
    if(a>0){g.save();g.globalAlpha=a*(1-gm);g.drawImage(LW,W/2-ww/2,cy-hh/2,ww,hh);g.restore();
      g.save();g.globalAlpha=a*gm;g.shadowColor='rgba(130,130,255,.8)';g.shadowBlur=30;g.drawImage(LC,W/2-ww/2,cy-hh/2,ww,hh);g.restore();}
    // ribbons crossing
    const r=win(t,8.4,10.2),fo=1-win(t,10.8,13.5);
    const P1=[[-W*.1,H*.55],[W*.25,H*.28],[W*.5,H*.50],[W*.8,H*.30],[W*1.1,H*.45]];
    const P2=[[-W*.1,H*.80],[W*.3,H*.55],[W*.55,H*.72],[W*.85,H*.42],[W*1.1,H*.2]];
    const P3=[[-W*.1,H*.20],[W*.3,H*.38],[W*.6,H*.30],[W*.9,H*.62],[W*1.1,H*.7]];
    P1.forEach(p=>p[1]+=Math.sin(t*.9+p[0]*.003)*30);P2.forEach(p=>p[1]+=Math.cos(t*.8+p[0]*.003)*30);
    glowRibbon(P1,0,r,80,CYA,fo*.9);glowRibbon(P2,0,r*.95,60,VIO,fo*.8);glowRibbon(P3,0,r*.9,45,BLU,fo*.7);
    // faint leaf-like swooshes in background
    const bgA=win(t,10,13)*.35;
    const L1=[[W*.82+Math.sin(t*.3)*40,H*1.1],[W*.88,H*.7],[W*.80,H*.35],[W*.9,H*.0]];
    glowRibbon(L1,0,1,140,['#2a1c9a','#4a34d0','#2a1c9a'],bgA,1.2);
    glowRibbon([[W*.1,H*0],[W*.16,H*.35],[W*.08,H*.7],[W*.14,H*1.1]].map(p=>[p[0]+Math.cos(t*.25)*30,p[1]]),0,1,110,['#24187a','#3a2cb8','#24187a'],bgA*.8,1.2);
    particles(t,win(t,8.5,11));
  }
  // fade in/out
  const f=1-win(t,0,.5);if(f>0){g.fillStyle=`rgba(3,0,40,${f})`;g.fillRect(0,0,W,H)}
}
function symbolSolid(cx,cy,s){
  const u=s/1000,ox=cx-482*u,oy=cy-482*u;g.fillStyle='#eef3ff';
  [[0,0,371,124],[0,0,124,371],[594,0,371,124],[841,0,124,371],[0,594,124,371],[0,841,371,124],[841,594,124,371],[594,841,371,124],[372,372,223,223]].forEach(([x,y,w,h])=>g.fillRect(ox+x*u,oy+y*u,w*u,h*u));}
window.render=t=>{g.setTransform(1,0,0,1,0,0);g.filter='none';g.globalAlpha=1;g.globalCompositeOperation='source-over';scene(t)};
const LW=new Image(),LC=new Image();
window.ready=Promise.all([document.fonts.load('800 80px Montserrat'),new Promise(r=>{LW.onload=r;LW.src='logo_white.png'}),new Promise(r=>{LC.onload=r;LC.src='logo_color.png'})]);
const q=new URLSearchParams(location.search);if(q.get('t'))render(+q.get('t'));
</script>
