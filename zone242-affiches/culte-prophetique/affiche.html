<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Zone 242 – Culte de prière et de déclaration prophétique</title>
<style>
@font-face{font-family:'M';src:url(assets/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:'M';src:url(assets/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:'M';src:url(assets/montserrat-latin-900-normal.woff2);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111}
.p{position:relative;width:1080px;height:1080px;overflow:hidden;font-family:'M',sans-serif;
 background:linear-gradient(172deg,#ffe9c9 0%,#ffbb74 14%,#ff6a35 30%,#d42c4c 48%,#6a21b8 68%,#2b0fcf 84%,#14008f 100%)}
.burst{position:absolute;left:560px;top:60px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,250,200,.98) 0%,rgba(255,226,140,.8) 14%,rgba(255,170,80,.35) 38%,rgba(255,120,60,0) 68%)}
.rays{position:absolute;left:560px;top:60px;width:1600px;height:1600px;margin:-800px 0 0 -800px;opacity:.35;
 background:repeating-conic-gradient(from 8deg,rgba(255,255,255,.55) 0 3deg,transparent 3deg 14deg);
 -webkit-mask:radial-gradient(circle,#000 0%,transparent 60%);mask:radial-gradient(circle,#000 0%,transparent 60%)}
.cross{position:absolute;left:350px;top:150px;width:14px;height:190px;background:linear-gradient(#fff,rgba(255,255,255,.1));filter:blur(3px);opacity:.55}
.cross::after{content:'';position:absolute;left:-52px;top:48px;width:118px;height:14px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.crowd{position:absolute;border-radius:50%;filter:blur(34px)}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(10,0,50,.45) 100%)}
.logo{position:absolute;left:50%;top:24px;height:104px;transform:translateX(-50%);filter:drop-shadow(0 4px 14px rgba(40,0,80,.35))}
.t1,.t2{position:absolute;left:0;right:0;text-align:center;font-weight:900;line-height:.82;letter-spacing:-.045em;color:#0d0614;white-space:nowrap;text-shadow:0 0 36px rgba(255,255,255,.35)}
.t1{top:146px;font-size:290px}
.t2{top:388px;font-size:290px}
.de{position:absolute;left:700px;top:346px;width:112px;height:112px;border-radius:50%;background:#e31e24;color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;box-shadow:0 8px 24px rgba(120,0,20,.45);z-index:3}
.box{position:absolute;left:96px;right:96px;top:640px;height:178px;border:2px solid rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 background:linear-gradient(180deg,rgba(40,10,120,.25),rgba(20,0,100,.35));backdrop-filter:blur(2px)}
.box b{display:block;font-weight:900;color:#fff;font-size:64px;line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
.box i{display:block;font-style:normal;font-weight:800;color:#ffd24a;font-size:26px;letter-spacing:.32em;margin-bottom:8px}
.spk{position:absolute;left:0;right:0;top:834px;height:60px;display:flex;align-items:center;justify-content:center;gap:16px}
.spk em{font-style:normal;font-weight:800;color:#fff;font-size:26px;letter-spacing:.02em}
.spk div{background:#f1ede4;color:#14071f;padding:0 30px;height:60px;display:flex;align-items:center;font-size:33px;font-weight:700;white-space:nowrap}
.spk div b{font-weight:900;margin-left:.3em}
.row{position:absolute;left:40px;right:40px;top:918px;height:128px;display:grid;grid-template-columns:1.05fr .85fr 1.2fr;gap:12px}
.row>div{display:flex;align-items:center;justify-content:center;text-align:center}
.date{background:#e31e24;color:#fff;gap:12px}
.date small{font-weight:800;font-size:23px;line-height:1.05;text-align:right}
.date strong{font-weight:900;font-size:98px;letter-spacing:-.05em;line-height:1}
.date span{font-weight:800;font-size:26px;line-height:1.05;text-align:left}
.time{background:#fff;color:#0d0614;flex-direction:column;gap:0}
.time small{font-weight:700;font-size:21px}
.time strong{font-weight:900;font-size:78px;letter-spacing:-.06em;line-height:.95}
.tonight{background:#ffd400;color:#0d0614;flex-direction:column;gap:2px}
.tonight strong{font-weight:900;font-size:56px;letter-spacing:-.04em;line-height:.95}
.tonight small{font-weight:700;font-size:21px;line-height:1.15}
</style></head><body>
<div class="p">
 <div class="burst"></div><div class="rays"></div><div class="cross"></div>
 <div class="crowd" style="left:-90px;top:300px;width:330px;height:470px;background:#7d1b3a;opacity:.55"></div>
 <div class="crowd" style="left:-40px;top:200px;width:200px;height:240px;background:#ff9a5c;opacity:.45"></div>
 <div class="crowd" style="right:-110px;top:230px;width:340px;height:520px;background:#5a1a7a;opacity:.55"></div>
 <div class="crowd" style="right:-30px;top:150px;width:220px;height:260px;background:#ffb57a;opacity:.5"></div>
 <div class="crowd" style="left:120px;top:700px;width:840px;height:260px;background:#3a14c4;opacity:.6"></div>
 <div class="vig"></div>
 <svg class="grain" width="1080" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1080" filter="url(#n)"/></svg>
 <img class="logo" src="assets/logo-couleur.png">
 <div class="t1" id="t1">Culte</div>
 <div class="de">de</div>
 <div class="t2" id="t2">Prière</div>
 <div class="box"><i>ET DE</i><b>Déclaration<br>prophétique</b></div>
 <div class="spk"><em>avec</em><div>L’Apôtre <b>AMOS ELITE</b></div></div>
 <div class="row">
  <div class="date"><small>Ven.<br>&gt;</small><strong>30</strong><span>octobre<br>2026</span></div>
  <div class="time"><small>ce soir à</small><strong>19h45</strong></div>
  <div class="tonight"><strong>ZONE 242</strong><small>Rejoignez-nous<br>pour ce temps de prière</small></div>
 </div>
</div>
<script>
document.fonts.load('900 100px M').then(()=>document.fonts.load('700 30px M')).then(()=>document.fonts.load('800 30px M')).then(()=>{
  for(const id of ['t1','t2']){const e=document.getElementById(id);const s=document.createElement('span');s.textContent=e.textContent;s.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:900 290px M;letter-spacing:-.045em';document.body.appendChild(s);let fs=290;while(s.offsetWidth>980&&fs>100){fs-=2;s.style.fontSize=fs+'px'}e.style.fontSize=fs+'px';s.remove()}
  document.body.setAttribute('data-ready','1');});
</script></body></html>
