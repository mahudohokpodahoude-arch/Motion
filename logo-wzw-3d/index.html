<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo WZW 3D — Week-end Zone Women</title>
    <script src="gsap/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ee1a02; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" data-start="0" data-duration="5" data-track-index="0" width="1920" height="1080"></canvas>
      <div id="flash" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <audio id="snd" src="assets/musique.mp3" data-start="0" data-duration="5" data-track-index="2" data-volume="1"></audio>
    </div>
    <script type="module">
      import { buildWorld } from "./src/world.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const ready = (async () => {
        const world = await buildWorld({ canvas: document.getElementById("gl") });
        window.addEventListener("hf-seek", (e) => world.renderAt(e.detail.time));
        world.renderAt(window.__hfThreeTime || 0);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.28, duration: 0.06, ease: "power2.out" }, 2.0);
        tl.to("#flash", { opacity: 0, duration: 0.45, ease: "power2.in" }, 2.06);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.3, duration: 0.05, immediateRender: false }, 4.0);
        tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.05);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
      window.__hf.buildReady["wzw3d"] = ready;
    </script>
  </body>
</html>
