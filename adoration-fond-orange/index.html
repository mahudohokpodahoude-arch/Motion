<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fond animé — braises orange ZONE 242 (boucle 10 s)</title>
    <script src="vendor/gsap/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #6b1a08; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #6b1a08; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!-- Fond pour paroles d'adoration, orange du logo ZONE 242 (#FF5A36) : une fumée qui monte et tourbillonne,
         des braises qui s'élèvent. Zone des paroles assombrie juste assez pour que le blanc reste lisible.
         Boucle parfaite de 10 s : tout le mouvement est périodique. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" data-start="0" data-duration="10" data-track-index="0" width="1920" height="1080"></canvas>
    </div>

    <script>
      // Pas d'animation GSAP : le mouvement vient des shaders, pilotés par le temps HyperFrames.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

    <script type="module">
      import * as THREE from "three";

      const LOOP = 10; // secondes — durée de la boucle
      const W = 1920, H = 1080;

      // ---------- palette (sRGB) : orange officiel ZONE 242 + braises plus profondes de la même teinte
      // toutes les nuances sont l'orange officiel #FF5A36 assombri (même teinte), sauf les cœurs lumineux
      const PALETTE = {
        base0: "#64231A", // bords (orange × 0,39)
        base1: "#8A311D", // fond au centre (orange × 0,54) : contraste blanc 8,4:1
        mid: "#C24529", // volutes (orange × 0,76)
        hot: "#FF5A36", // orange officiel du logo
        peach: "#FFA58A", // cœur lumineux des volutes (hors zone de texte)
        spark: "#FFE4D6", // cœur des étincelles
      };
      const lin = (hex) => new THREE.Color(hex); // THREE convertit en linéaire

      // ---------- bruits simplex 3D et 4D (Ian McEwan, Stefan Gustavson — Ashima Arts, licence MIT)
      const NOISE = /* glsl */ `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        float mod289(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 10.0) * x); }
        float permute(float x) { return mod289(((x * 34.0) + 10.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float taylorInvSqrt(float r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
          const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod289(i);
          vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n_ = 0.142857142857;
          vec3 ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);
          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.5 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
          m = m * m;
          return 105.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }
        vec4 grad4(float j, vec4 ip) {
          const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
          vec4 p, s;
          p.xyz = floor(fract(vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
          p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
          s = vec4(lessThan(p, vec4(0.0)));
          p.xyz = p.xyz + (s.xyz * 2.0 - 1.0) * s.www;
          return p;
        }
        float snoise(vec4 v) {
          const vec4 C = vec4(0.138196601125011, 0.276393202250021, 0.414589803375032, -0.447213595499958);
          vec4 i = floor(v + dot(v, vec4(0.309016994374947451)));
          vec4 x0 = v - i + dot(i, C.xxxx);
          vec4 i0;
          vec3 isX = step(x0.yzw, x0.xxx);
          vec3 isYZ = step(x0.zww, x0.yyz);
          i0.x = isX.x + isX.y + isX.z;
          i0.yzw = 1.0 - isX;
          i0.y += isYZ.x + isYZ.y;
          i0.zw += 1.0 - isYZ.xy;
          i0.z += isYZ.z;
          i0.w += 1.0 - isYZ.z;
          vec4 i3 = clamp(i0, 0.0, 1.0);
          vec4 i2 = clamp(i0 - 1.0, 0.0, 1.0);
          vec4 i1 = clamp(i0 - 2.0, 0.0, 1.0);
          vec4 x1 = x0 - i1 + C.xxxx;
          vec4 x2 = x0 - i2 + C.yyyy;
          vec4 x3 = x0 - i3 + C.zzzz;
          vec4 x4 = x0 + C.wwww;
          i = mod289(i);
          float j0 = permute(permute(permute(permute(i.w) + i.z) + i.y) + i.x);
          vec4 j1 = permute(permute(permute(permute(
                    i.w + vec4(i1.w, i2.w, i3.w, 1.0))
                  + i.z + vec4(i1.z, i2.z, i3.z, 1.0))
                  + i.y + vec4(i1.y, i2.y, i3.y, 1.0))
                  + i.x + vec4(i1.x, i2.x, i3.x, 1.0));
          vec4 ip = vec4(1.0 / 294.0, 1.0 / 49.0, 1.0 / 7.0, 0.0);
          vec4 p0 = grad4(j0, ip);
          vec4 p1 = grad4(j1.x, ip);
          vec4 p2 = grad4(j1.y, ip);
          vec4 p3 = grad4(j1.z, ip);
          vec4 p4 = grad4(j1.w, ip);
          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          p4 *= taylorInvSqrt(dot(p4, p4));
          vec3 m0 = max(0.6 - vec3(dot(x0, x0), dot(x1, x1), dot(x2, x2)), 0.0);
          vec2 m1 = max(0.6 - vec2(dot(x3, x3), dot(x4, x4)), 0.0);
          m0 = m0 * m0;
          m1 = m1 * m1;
          return 49.0 * (dot(m0 * m0, vec3(dot(p0, x0), dot(p1, x1), dot(p2, x2)))
                       + dot(m1 * m1, vec2(dot(p3, x3), dot(p4, x4))));
        }
        vec3 fade3(vec3 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }
        // bruit de Perlin périodique (période rep par axe) — Stefan Gustavson, licence MIT
        float pnoise(vec3 P, vec3 rep) {
          vec3 Pi0 = mod(floor(P), rep);
          vec3 Pi1 = mod(Pi0 + vec3(1.0), rep);
          Pi0 = mod289(Pi0);
          Pi1 = mod289(Pi1);
          vec3 Pf0 = fract(P);
          vec3 Pf1 = Pf0 - vec3(1.0);
          vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
          vec4 iy = vec4(Pi0.yy, Pi1.yy);
          vec4 iz0 = Pi0.zzzz;
          vec4 iz1 = Pi1.zzzz;
          vec4 ixy = permute(permute(ix) + iy);
          vec4 ixy0 = permute(ixy + iz0);
          vec4 ixy1 = permute(ixy + iz1);
          vec4 gx0 = ixy0 * (1.0 / 7.0);
          vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
          gx0 = fract(gx0);
          vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
          vec4 sz0 = step(gz0, vec4(0.0));
          gx0 -= sz0 * (step(0.0, gx0) - 0.5);
          gy0 -= sz0 * (step(0.0, gy0) - 0.5);
          vec4 gx1 = ixy1 * (1.0 / 7.0);
          vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
          gx1 = fract(gx1);
          vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
          vec4 sz1 = step(gz1, vec4(0.0));
          gx1 -= sz1 * (step(0.0, gx1) - 0.5);
          gy1 -= sz1 * (step(0.0, gy1) - 0.5);
          vec3 g000 = vec3(gx0.x, gy0.x, gz0.x);
          vec3 g100 = vec3(gx0.y, gy0.y, gz0.y);
          vec3 g010 = vec3(gx0.z, gy0.z, gz0.z);
          vec3 g110 = vec3(gx0.w, gy0.w, gz0.w);
          vec3 g001 = vec3(gx1.x, gy1.x, gz1.x);
          vec3 g101 = vec3(gx1.y, gy1.y, gz1.y);
          vec3 g011 = vec3(gx1.z, gy1.z, gz1.z);
          vec3 g111 = vec3(gx1.w, gy1.w, gz1.w);
          vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
          g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
          vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
          g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;
          float n000 = dot(g000, Pf0);
          float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
          float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
          float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
          float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
          float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
          float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
          float n111 = dot(g111, Pf1);
          vec3 fxyz = fade3(Pf0);
          vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fxyz.z);
          vec2 n_yz = mix(n_z.xy, n_z.zw, fxyz.y);
          return 2.2 * mix(n_yz.x, n_yz.y, fxyz.x);
        }
      `;

      // Zone des paroles (centre du cadre) et plafonnement de luminance : garantit le contraste du texte blanc.
      const ZONE = /* glsl */ `
        // zone des paroles : rectangle arrondi, protection complète sur 8–92 % de la largeur et 19–81 % de la hauteur
        float textZone(vec2 uv) {
          vec2 d = abs(uv - 0.5) / vec2(0.42, 0.31);
          vec2 d2 = d * d;
          vec2 d6 = d2 * d2 * d2;
          float k = pow(d6.x + d6.y, 1.0 / 6.0);
          return 1.0 - smoothstep(1.0, 1.5, k);
        }
        // n'agit qu'au-dessus du genou : le fond (sous le genou) reste identique partout, aucune frontière visible
        vec3 capLum(vec3 c, float lmax, float kneeFrac) {
          float L = dot(c, vec3(0.2126, 0.7152, 0.0722));
          float knee = lmax * kneeFrac;
          float over = max(L - knee, 0.0);
          float Lc = min(L, knee) + over / (1.0 + over / (lmax - knee));
          return c * (Lc / max(L, 1e-6));
        }
      `;

      const quadVert = /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

      // ---------- passe 1 (demi-résolution) : champ de fumée qui monte et tourbillonne
      const smokeFrag = /* glsl */ `
        uniform float uTime, uLoop;
        varying vec2 vUv;
        ${NOISE}
        float fbmP(vec3 p, vec3 rep) {
          float s = 0.0, a = 0.5;
          for (int i = 0; i < 5; i++) {
            s += a * pnoise(p, rep);
            p = p * 2.0 + vec3(17.0, 31.0, 7.0);
            rep *= 2.0;
            a *= 0.5;
          }
          return s;
        }
        void main() {
          float u = uTime / uLoop; // 0 → 1 sur la boucle
          const float F = 3.0; // cellules de bruit par hauteur d'écran
          const float RY = 3.0; // période verticale (= une hauteur d'écran) : la fumée monte d'une période par boucle
          const float RZ = 2.0; // période d'évolution : les volutes se transforment et reviennent
          vec2 sp = vec2((vUv.x - 0.5) * 1.7778, vUv.y) * F;
          float Z = RZ * u;
          vec3 rep = vec3(289.0, RY, RZ);
          // tourbillon fixé à l'écran : balancement latéral, et la fumée ne se répète jamais à l'identique
          vec2 sw = vec2(pnoise(vec3(sp * 0.55, Z + 0.3), vec3(289.0, 289.0, RZ)),
                         pnoise(vec3(sp * 0.55 + 19.7, Z + 1.1), vec3(289.0, 289.0, RZ)));
          // repère qui monte avec la fumée
          vec2 q = vec2(sp.x, sp.y - RY * u) + 0.5 * sw;
          vec2 w = vec2(fbmP(vec3(q, Z), rep), fbmP(vec3(q + vec2(5.2, 0.0), Z + 0.5), rep));
          float d = fbmP(vec3(q + 1.0 * w, Z), rep);
          gl_FragColor = vec4(d, 0.0, 0.0, 1.0);
        }
      `;

      // ---------- passe 2 (pleine résolution) : couleurs, lueur du bas, zone des paroles
      const colorFrag = /* glsl */ `
        uniform sampler2D uField;
        uniform float uTime, uLoop;
        uniform vec3 uBase0, uBase1, uMid, uHot, uPeach;
        varying vec2 vUv;
        ${ZONE}
        void main() {
          float tau = 6.28318530718 * uTime / uLoop;
          float m = texture2D(uField, vUv).r;
          float side = smoothstep(0.12, 0.5, abs(vUv.x - 0.5));
          float bottom = smoothstep(0.55, 0.0, vUv.y);
          float presence = mix(0.3, 1.0, max(side, bottom * 0.85)); // fumée surtout sur les côtés et en bas
          // seuils calés sur la distribution réelle du champ (médiane ≈ 0,02, 92e centile ≈ 0,18) : fumée douce, sans marbrure
          float body = smoothstep(0.0, 0.22, m) * presence;
          float wisp = pow(smoothstep(0.08, 0.42, m), 1.4) * presence;
          float zone = textZone(vUv);
          float r = length((vUv - vec2(0.5, 0.52)) * vec2(1.45, 1.0));
          vec3 col = mix(uBase1, uBase0, smoothstep(0.3, 1.0, r));
          col = mix(col, uMid, body * 0.6);
          col = mix(col, uHot, wisp * 0.72);
          col = mix(col, uPeach, wisp * wisp * 0.24 * (1.0 - zone)); // le pêche grisaille s'il est assombri : hors zone seulement
          // lueur de braises par le bas, large et douce, qui palpite (deux fois par boucle)
          float glow = exp(-pow(vUv.y / 0.2, 2.0)) * (0.84 + 0.16 * sin(2.0 * tau));
          col += uHot * 0.22 * glow;
          // lisibilité : derrière les paroles, luminance plafonnée à 0,105 → contraste blanc ≥ 6,7:1
          // plafond qui descend progressivement (interpolation logarithmique) : aucune frontière visible
          col = capLum(col, exp(mix(log(0.75), log(0.105), zone)), 0.82);
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      // ---------- passe 3 : finition (plafond souple pour les étincelles au centre, sRGB, grain)
      const finalFrag = /* glsl */ `
        uniform sampler2D uMain;
        uniform float uFrame;
        varying vec2 vUv;
        ${ZONE}
        vec3 toSrgb(vec3 l) { return mix(l * 12.92, 1.055 * pow(l, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, l)); }
        float hash(vec2 p) {
          p = fract(p * vec2(443.897, 441.423));
          p += dot(p, p.yx + 19.19);
          return fract((p.x + p.y) * p.x);
        }
        void main() {
          vec3 col = texture2D(uMain, vUv).rgb;
          col = capLum(col, exp(mix(log(8.0), log(0.2), textZone(vUv))), 0.6);
          col = toSrgb(clamp(col, 0.0, 1.0));
          float g = hash(floor(vUv * vec2(1920.0, 1080.0)) + uFrame * vec2(17.0, 31.0)) - 0.5;
          gl_FragColor = vec4(col + g * (2.0 / 255.0), 1.0);
        }
      `;

      // ---------- braises : étincelles qui montent + grosses lueurs floues sur les côtés
      const sparkVert = /* glsl */ `
        attribute float aSize; attribute float aAlpha; attribute float aSoft; attribute vec3 aColor;
        varying float vAlpha; varying float vSoft; varying vec3 vColor;
        ${ZONE}
        void main() {
          // derrière les paroles, les lueurs floues s'effacent presque et les étincelles s'atténuent
          float z = textZone(position.xy * 0.5 + 0.5);
          vAlpha = aAlpha * mix(1.0, mix(0.6, 0.12, aSoft), z);
          vSoft = aSoft; vColor = aColor; gl_PointSize = aSize; gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;
      const sparkFrag = /* glsl */ `
        varying float vAlpha; varying float vSoft; varying vec3 vColor;
        void main() {
          vec2 q = gl_PointCoord - 0.5;
          float r = length(q) * 2.0;
          if (r > 1.0) discard;
          float core = exp(-r * r * 34.0);
          float halo = exp(-r * r * 4.5) * 0.45;
          vec3 ember = vColor * (halo * 1.5 + core * 1.8) + vec3(1.0, 0.78, 0.58) * core * 1.6;
          vec3 orb = vColor * exp(-r * r * 3.0) * smoothstep(1.0, 0.75, r);
          gl_FragColor = vec4(mix(ember, orb, vSoft) * vAlpha, 1.0);
        }
      `;

      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function makeEmbers() {
        const r = rng(242);
        const list = [];
        const hot = lin(PALETTE.hot), core = lin(PALETTE.spark);
        const add = (n, o) => {
          for (let i = 0; i < n; i++) {
            const side = r() < 0.5 ? r() * 0.32 : 0.68 + r() * 0.32;
            list.push({
              x0: (o.sides ? side : r()) * W,
              y0: o.yMin + r() * (o.yMax - o.yMin),
              dist: o.speed[0] + r() * (o.speed[1] - o.speed[0]),
              life: o.life,
              ph: r(),
              amp: o.amp[0] + r() * (o.amp[1] - o.amp[0]),
              k: o.k[Math.floor(r() * o.k.length)],
              ph2: r() * 6.283,
              fl: 3 + Math.floor(r() * 9),
              ph3: r() * 6.283,
              size: o.size[0] + r() * (o.size[1] - o.size[0]),
              alpha: o.alpha[0] + r() * (o.alpha[1] - o.alpha[0]),
              soft: o.soft,
              col: o.soft ? hot.clone().multiplyScalar(0.8) : hot.clone().lerp(core, r() * 0.25).multiplyScalar(o.gain),
            });
          }
        };
        // lointaines : fines, lentes, nombreuses
        add(100, { yMin: 380, yMax: 1180, speed: [650, 1050], life: 10, amp: [6, 20], k: [1, 2], size: [12, 18], alpha: [0.5, 0.9], soft: 0, gain: 1.6 });
        // proches : plus vives, rapides, qui ondulent
        add(56, { yMin: 560, yMax: 1220, speed: [750, 1200], life: 5, amp: [14, 46], k: [2, 3, 4], size: [20, 30], alpha: [0.7, 1.0], soft: 0, gain: 2.2 });
        // lueurs floues au premier plan, sur les côtés (profondeur)
        add(10, { yMin: 250, yMax: 1300, speed: [250, 520], life: 10, amp: [20, 60], k: [1], size: [110, 200], alpha: [0.1, 0.2], soft: 1, gain: 1, sides: true });
        return list;
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const ready = (async () => {
        const canvas = document.getElementById("gl");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H, false);
        const rtOpts = { type: THREE.HalfFloatType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
        const fieldRT = new THREE.WebGLRenderTarget(W / 2, H / 2, rtOpts);
        const mainRT = new THREE.WebGLRenderTarget(W, H, rtOpts);
        const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const quad = (material) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
          m.frustumCulled = false;
          const s = new THREE.Scene();
          s.add(m);
          return s;
        };
        const smokeMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uLoop: { value: LOOP } },
          vertexShader: quadVert, fragmentShader: smokeFrag, depthTest: false, depthWrite: false,
        });
        const colorMat = new THREE.ShaderMaterial({
          uniforms: {
            uField: { value: fieldRT.texture }, uTime: { value: 0 }, uLoop: { value: LOOP },
            uBase0: { value: lin(PALETTE.base0) }, uBase1: { value: lin(PALETTE.base1) }, uMid: { value: lin(PALETTE.mid) },
            uHot: { value: lin(PALETTE.hot) }, uPeach: { value: lin(PALETTE.peach) },
          },
          vertexShader: quadVert, fragmentShader: colorFrag, depthTest: false, depthWrite: false,
        });
        const finalMat = new THREE.ShaderMaterial({
          uniforms: { uMain: { value: mainRT.texture }, uFrame: { value: 0 } },
          vertexShader: quadVert, fragmentShader: finalFrag, depthTest: false, depthWrite: false,
        });
        const smokeScene = quad(smokeMat);
        const mainScene = quad(colorMat);
        const finalScene = quad(finalMat);

        const embers = makeEmbers();
        const n = embers.length;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(n * 3), size = new Float32Array(n), alpha = new Float32Array(n), soft = new Float32Array(n), col = new Float32Array(n * 3);
        embers.forEach((e, i) => { soft[i] = e.soft; col[i * 3] = e.col.r; col[i * 3 + 1] = e.col.g; col[i * 3 + 2] = e.col.b; });
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
        geo.setAttribute("aAlpha", new THREE.BufferAttribute(alpha, 1));
        geo.setAttribute("aSoft", new THREE.BufferAttribute(soft, 1));
        geo.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
        const sparks = new THREE.Points(geo, new THREE.ShaderMaterial({
          vertexShader: sparkVert, fragmentShader: sparkFrag, transparent: true, depthTest: false, depthWrite: false,
          blending: THREE.AdditiveBlending,
        }));
        sparks.frustumCulled = false;
        sparks.renderOrder = 1;
        mainScene.add(sparks);

        const TAU = Math.PI * 2;
        const placeEmbers = (t) => {
          embers.forEach((e, i) => {
            const s = (t / e.life + e.ph) % 1; // cycle de vie, période qui divise 10 s
            const y = e.y0 - s * e.dist;
            const x = e.x0 + e.amp * Math.sin(TAU * (e.k * t) / LOOP + e.ph2);
            const env = Math.min(1, s / 0.12) * (1 - Math.max(0, (s - 0.68) / 0.32));
            const flick = 0.72 + 0.28 * Math.sin(TAU * (e.fl * t) / LOOP + e.ph3);
            pos[i * 3] = x / (W / 2) - 1;
            pos[i * 3 + 1] = 1 - y / (H / 2);
            size[i] = e.size * (e.soft ? 1 : 1 - 0.35 * s);
            alpha[i] = e.alpha * env * (e.soft ? 1 : flick);
          });
          for (const k of ["position", "aSize", "aAlpha"]) geo.attributes[k].needsUpdate = true;
        };

        const renderAt = (t) => {
          smokeMat.uniforms.uTime.value = t;
          colorMat.uniforms.uTime.value = t;
          finalMat.uniforms.uFrame.value = Math.round(t * 30);
          placeEmbers(t);
          renderer.setRenderTarget(fieldRT);
          renderer.render(smokeScene, cam);
          renderer.setRenderTarget(mainRT);
          renderer.render(mainScene, cam);
          renderer.setRenderTarget(null);
          renderer.render(finalScene, cam);
        };
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      })();
      window.__hf.buildReady["fond-braises"] = ready;
    </script>
  </body>
</html>
