<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Un mot, une session · style Vibe motion</title>
    <script src="gsap/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/bebas-neue-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ee1a02; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Mont", sans-serif; color: #121212;
        background: linear-gradient(160deg, #ee1a02 0%, #f12e04 36%, #f5541a 72%, #fb7a2a 100%); }
      .sh { inset: 0; } .s1 { background: #ff7a33; opacity: .18; clip-path: polygon(0 0, 22% 0, 8% 100%, 0 100%); } .s2 { background: #b80f00; opacity: .20; clip-path: polygon(38% 0, 52% 0, 34% 100%, 20% 100%); } .s3 { background: #ff9a4a; opacity: .16; clip-path: polygon(70% 0, 84% 0, 66% 100%, 52% 100%); } .s4 { background: #c01200; opacity: .18; clip-path: polygon(90% 0, 100% 0, 100% 100%, 76% 100%); }
      #glow { left: 90px; top: 520px; width: 900px; height: 900px; background: radial-gradient(closest-side, rgba(255,190,140,.55), rgba(255,190,140,0)); }
      .abs { position: absolute; }
      .star { width: 18px; height: 18px; background: rgba(255,255,255,.7); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
      .star.o { background: #ffd9bf; opacity: .9; }
      .sc { inset: 0; opacity: 0; }
      #scenes { position: absolute; inset: 0; transform: translateY(70px); }
      .pill { left: 50%; transform-origin: 50% 50%; display: flex; align-items: center; gap: 14px; white-space: nowrap; border-radius: 16px; font-weight: 800; letter-spacing: .01em; }
      .pill.k { top: 300px; background: #121212; color: #fff; font-size: 38px; padding: 18px 34px; box-shadow: 0 10px 24px rgba(0,0,0,.22); }
      .pill.k svg { width: 38px; height: 38px; stroke: #f5541a; }
      .card { left: 90px; width: 900px; top: 450px; height: 560px; background: #fff; border-radius: 40px; box-shadow: 0 30px 60px rgba(110,10,0,.35), 0 4px 10px rgba(110,10,0,.15);
        display: flex; flex-direction: column; align-items: center; justify-content: center; transform-origin: 50% 50%; }
      .card .w { font-family: "Bebas", sans-serif; line-height: .88; text-align: center; color: #121212; letter-spacing: .01em; }
      .card .w div { display: block; white-space: nowrap; }
      .card .w .o { color: #f5541a; }
      .ico { width: 170px; height: 170px; border-radius: 50%; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; left: 790px; top: 380px; transform-origin: 50% 50%; }
      .ico svg { width: 84px; height: 84px; stroke: #0260a6; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .pill.h { top: 975px; background: #0260a6; color: #fff; font-size: 50px; padding: 20px 42px; border-radius: 18px; box-shadow: 0 14px 30px rgba(2,50,100,.4); }
      .pill.h svg { width: 46px; height: 46px; stroke: #fff; }
      .cap { left: 110px; width: 860px; top: 1160px; text-align: center; font-size: 50px; line-height: 1.32; font-weight: 600; color: #fff; text-shadow: 0 3px 14px rgba(110,10,0,.3); }
      .cap span { color: rgba(255,255,255,.5); }
      #foot { left: 0; width: 1080px; top: 1560px; text-align: center; }
      #lock { display: block; margin: 0 auto; width: 200px; filter: drop-shadow(0 0 12px rgba(255,255,255,.45)); }
      #inf { margin-top: 14px; font-size: 26px; font-weight: 800; letter-spacing: .12em; color: #ffe3cf; }
      .pill.c { top: 1735px; background: #121212; color: #fff; font-size: 34px; padding: 16px 32px; opacity: 0; }
      .pill.c svg { width: 34px; height: 34px; stroke: #f5541a; }
      svg { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1080" data-height="1920">
      <div class="sh abs s1"></div><div class="sh abs s2"></div><div class="sh abs s3"></div><div class="sh abs s4"></div><div id="glow" class="abs"></div>
      <div id="stars"></div>
      <div id="scenes"></div>
      <div id="foot" class="abs"><img id="lock" src="assets/lockup.png" alt="" /><div id="inf">27–29 NOVEMBRE · GRATUIT · 150 PLACES</div></div>
      <div class="pill c abs" id="cta"><svg viewBox="0 0 24 24" stroke="#f5541a"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Inscription : lien en bio</div>
      <audio id="snd" src="assets/musique.mp3" data-start="0" data-duration="36" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const IC = {
        heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
        smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
        send: '<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
        trend: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
        home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
        chat: '<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      };
      const svg = (n, extra = "") => `<svg viewBox="0 0 24 24" ${extra}>${IC[n]}</svg>`;
      // [lignes du mot [texte, taille], icône, étiquette, heure, légende (mots ; * = mot clé)]
      const S = [
        { w: [["GUÉRIR", 330]], ic: "heart", k: "Panel 1", h: "Samedi · 10h30", cap: "On parle de *guérir* des traumatismes émotionnels." },
        { w: [["PRENDRE", 250], ["SOIN DE SOI", 190]], ic: "smile", k: "Belle et en bonne santé", h: "Samedi · 12h00", cap: "*Belle* et en bonne santé : prendre soin de soi." },
        { w: [["SERVIR", 330]], ic: "send", k: "Panel 2", h: "Samedi · 14h00", cap: "Me voici, envoie-moi ! Comment *servir* avec ce que tu as." },
        { w: [["BIEN", 280], ["GÉRER", 280]], ic: "trend", k: "Panel 3", h: "Samedi · 15h00", cap: "Femme, foi et finances : *bien gérer* son argent." },
        { w: [["BÂTIR", 330]], ic: "home", k: "Panel 4", h: "Samedi · 16h00", cap: "Ma maison, ma mission : *bâtir* un foyer solide." },
        { w: [["OSER EN", 250], ["PARLER", 250]], ic: "chat", k: "Grande table ronde", h: "Samedi · 17h15", cap: "*Oser en parler* : sans jugement, sans masque." },
      ];
      // confettis d'étoiles (positions fixes)
      const stars = $("#stars"); const ST = [[60, 210, 0], [980, 260, 1], [150, 640, 0], [930, 760, 0], [90, 1010, 1], [1000, 1080, 0], [200, 1480, 0], [880, 1450, 1], [520, 190, 0], [40, 1700, 0], [1010, 1700, 0], [540, 1840, 0]];
      ST.forEach(([x, y, o], i) => stars.insertAdjacentHTML("beforeend", `<div class="star abs${o ? " o" : ""}" style="left:${x}px;top:${y}px;width:${14 + (i % 3) * 5}px;height:${14 + (i % 3) * 5}px"></div>`));
      const sc = $("#scenes"); const E = [];
      S.forEach((c, i) => {
        const wd = c.w.map(([t, fs]) => `<div style="font-size:${fs}px">${t}</div>`).join("");
        const words = c.cap.split(" ").map((x) => x.startsWith("*") || x.endsWith("*") || /^\*/.test(x) ? x : x);
        // légende : une portion entre * ... * est mise en avant ; on découpe mot à mot
        let key = false; const spans = [];
        c.cap.split(" ").forEach((x) => { let k = key; if (x.startsWith("*")) { key = true; k = true; x = x.slice(1); } if (x.endsWith("*")) { key = false; k = true; x = x.slice(0, -1); } spans.push(`<span data-k="${k ? 1 : 0}">${x}</span>`); });
        sc.insertAdjacentHTML("beforeend", `<div class="sc abs" id="sc${i}">
          <div class="pill k abs">${svg("cal")}${c.k}</div>
          <div class="card abs"><div class="w">${wd}</div></div>
          <div class="ico abs">${svg(c.ic)}</div>
          <div class="pill h abs">${svg("clock")}${c.h}</div>
          <div class="cap abs">${spans.join(" ")}</div></div>`);
        const e = $("#sc" + i);
        E.push({ e, k: e.querySelector(".pill.k"), card: e.querySelector(".card"), ico: e.querySelector(".ico"), h: e.querySelector(".pill.h"), words: [...e.querySelectorAll(".cap span")] });
      });
      const tl = gsap.timeline({ paused: true });
      gsap.set([".pill.k", ".pill.h"], { xPercent: -50 }); gsap.set(".pill.c", { xPercent: -50 });
      gsap.set([".pill.k", ".pill.h", ".card", ".ico"], { opacity: 0 }); gsap.set(".cap", { opacity: 0 });
      // étoiles : scintillement permanent
      document.querySelectorAll(".star").forEach((s, i) => { tl.fromTo(s, { opacity: .25, scale: .8 }, { opacity: 1, scale: 1.2, duration: .9, ease: "sine.inOut", yoyo: true, repeat: 39 }, (i % 5) * .17); });
      S.forEach((c, i) => {
        const s = i * 6, e = E[i];
        tl.set(e.e, { opacity: 1 }, s - .05 < 0 ? 0 : s - .05);
        // entrées : pastille noire, carte, icône, heure
        tl.fromTo(e.k, { opacity: 0, y: -30, scale: .7, rotation: -5 }, { opacity: 1, y: 0, scale: 1, rotation: 0, duration: .45, ease: "back.out(2)" }, s + .2);
        tl.fromTo(e.card, { opacity: 0, y: 90, scale: .86, rotation: 3 }, { opacity: 1, y: 0, scale: 1, rotation: 0, duration: .6, ease: "back.out(1.6)" }, s + .45);
        tl.fromTo(e.ico, { opacity: 0, scale: .2, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: .55, ease: "back.out(2.4)" }, s + .95);
        tl.fromTo(e.h, { opacity: 0, y: 40, scale: .8, rotation: 3 }, { opacity: 1, y: 0, scale: 1, rotation: 0, duration: .5, ease: "back.out(2)" }, s + 1.35);
        tl.fromTo(e.e.querySelector(".cap"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .35, ease: "power2.out" }, s + 1.5);
        // légende : mot à mot
        e.words.forEach((w, j) => {
          const t = s + 1.9 + j * .3;
          tl.to(w, { color: "#ffffff", duration: .15, ease: "none" }, t);
          if (w.dataset.k === "1") tl.set(w, { fontWeight: 800 }, t);
        });
        // vie : léger flottement
        tl.to(e.card, { y: -10, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, s + 1.2);
        tl.to(e.ico, { rotation: 8, duration: .8, ease: "sine.inOut", yoyo: true, repeat: 3 }, s + 1.6);
        // sortie
        tl.to([e.k, e.card, e.ico, e.h, e.e.querySelector(".cap")], { opacity: 0, scale: .94, y: 20, duration: .28, ease: "power2.in", stagger: .02 }, s + 5.62);
        tl.set(e.e, { opacity: 0 }, s + 6);
      });
      tl.fromTo("#cta", { opacity: 0, y: 40, scale: .8 }, { opacity: 1, y: 0, scale: 1, duration: .5, ease: "back.out(2)" }, 30 + 3.2);
      tl.to("#cta", { opacity: 0, duration: .4 }, 35.5);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: .5 }, .3);
      tl.to("#foot", { opacity: 0, duration: .5 }, 35.45);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
