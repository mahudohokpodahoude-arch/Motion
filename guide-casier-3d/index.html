<body>
<div id="stage">
  <div id="cap"><div id="kick"></div><div id="num"></div><h1 id="ttl"></h1><p id="sub"></p></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1920, H = 1080;
const TL = await (await fetch('timeline.json')).json();   // calé sur la voix off (voice/make_voice.py)
const TT = TL.TT;                          // titre, 7 étapes, récap, outro, fin
const DUR = TT[10];
window.DUR = DUR;
await Promise.all([500,600,700,800,900].map(w => document.fonts.load(`${w} 20px M`)));
const GREEN = '#008751', YELLOW = '#FCD116', RED = '#E8112D', INK = '#14201A';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- canvas helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function txt(c, s, x, y, font, color, align = 'left') { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); }

// ---------- phone screen : vraies captures (720 x 1465) ----------
const SW = 720, SH = 1465;
const screenCv = document.createElement('canvas'); screenCv.width = SW; screenCv.height = SH;
const sc = screenCv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = SW; layer.height = SH;
const lc = layer.getContext('2d');
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const IMG = {};
for (const n of ['01_accueil', '02_service', '03_profil', '04_otp_vide', '05_otp_saisi', '06_informations', '07_paiement']) IMG[n] = await loadImg(`assets/real/${n}.png`);

function cursorAt(pts, lt) {
  if (lt <= pts[0].t) return { x: pts[0].x, y: pts[0].y };
  for (let i = 1; i < pts.length; i++) if (lt <= pts[i].t) {
    const a = pts[i - 1], b = pts[i], k = eio((lt - a.t) / (b.t - a.t));
    return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) };
  }
  const l = pts[pts.length - 1]; return { x: l.x, y: l.y };
}
function drawCursor(c, pts, taps, lt, fadeOutAt = 1e9) {
  const p = cursorAt(pts, lt);
  const alpha = clamp((lt - pts[0].t) / .3) * (1 - clamp((lt - fadeOutAt) / .4));
  if (alpha <= 0) return;
  for (const tp of taps) {
    const d = lt - tp;
    if (d > 0 && d < .7) { c.strokeStyle = `rgba(0,135,81,${(1 - d / .7) * .85 * alpha})`; c.lineWidth = 7; c.beginPath(); c.arc(p.x, p.y, 34 + d * 160, 0, 7); c.stroke(); }
  }
  let press = 0; for (const tp of taps) { const d = lt - tp; if (d > -.1 && d < .25) press = Math.max(press, 1 - Math.abs(d - .075) / .2); }
  c.globalAlpha = alpha; c.fillStyle = 'rgba(20,32,26,.30)'; c.beginPath(); c.arc(p.x, p.y, 46 * (1 - .22 * press), 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 7; c.stroke(); c.globalAlpha = 1;
}
function glow(c, x, y, w, h, lt, a, b, r = 18) {            // contour vert pulsé autour d'un champ
  if (lt < a || lt > b) return;
  const k = clamp((lt - a) / .4) * (1 - clamp((lt - b + .4) / .4)), pu = (Math.sin((lt - a) * 6) + 1) / 2;
  c.save(); c.globalAlpha = k; c.strokeStyle = GREEN; c.lineWidth = 6 + 3 * pu; c.shadowColor = 'rgba(0,135,81,.55)'; c.shadowBlur = 24;
  rr(c, x, y, w, h, r); c.stroke(); c.restore();
}
function img(c, name, dy = 0) { c.drawImage(IMG[name], 0, dy); }

// coordonnées en pixels de la capture rognée (720 x 1465)
const SCREENS = [
  { b: TT[0], old: 5, f: (c, lt) => img(c, '01_accueil') },
  { b: TT[1], old: 7, f: (c, lt) => { img(c, '01_accueil'); glow(c, 48, 1209, 624, 98, lt, 1.6, 3.6, 49);
      drawCursor(c, [{ t: 0, x: 600, y: 1380 }, { t: 2.6, x: 330, y: 1262 }, { t: 3.0, x: 330, y: 1262 }], [3.0], lt, 4.0); } },
  { b: TT[2], old: 7, f: (c, lt) => { img(c, '02_service'); glow(c, 66, 691, 437, 80, lt, 1.6, 3.5, 40);
      drawCursor(c, [{ t: 0, x: 620, y: 1100 }, { t: 3.0, x: 280, y: 735 }, { t: 3.5, x: 280, y: 735 }], [3.5], lt, 4.5); } },
  { b: TT[3], old: 7, f: (c, lt) => { img(c, '03_profil');
      if (lt > 2.3) { c.fillStyle = '#1B4F8A'; c.beginPath(); c.arc(115, 655, 14, 0, 7); c.fill(); c.strokeStyle = '#1B4F8A'; c.lineWidth = 6; rr(c, 63, 584, 594, 140, 18); c.stroke(); }
      glow(c, 63, 584, 594, 140, lt, .6, 2.3, 18); glow(c, 72, 1303, 530, 96, lt, 3.6, 5.0, 48);
      drawCursor(c, [{ t: 0, x: 620, y: 900 }, { t: 1.8, x: 115, y: 655 }, { t: 2.3, x: 115, y: 655 }, { t: 4.8, x: 340, y: 1352 }, { t: 5.0, x: 340, y: 1352 }], [2.3, 5.0], lt, 6.0); } },
  { b: TT[4], old: 9, f: (c, lt) => {
      img(c, '04_otp_vide');
      const A = eo((lt - 3.0) / .5); if (A > 0) { c.globalAlpha = A; img(c, '05_otp_saisi'); c.globalAlpha = 1; }
      glow(c, 63, 567, 594, 94, lt, .5, 1.5, 18);
      if (lt > 5.3) glow(c, 63, 1235, 594, 96, lt, 5.6, 7.2, 48);
      drawCursor(c, [{ t: 0, x: 620, y: 900 }, { t: 1.2, x: 300, y: 565 }, { t: 3.8, x: 300, y: 565 }, { t: 5.2, x: 340, y: 745 }, { t: 7.2, x: 340, y: 1270 }, { t: 7.4, x: 340, y: 1270 }], [1.2, 5.2, 7.4], lt, 8.3); } },
  { b: TT[5], old: 6, f: (c, lt) => { img(c, '06_informations');
      glow(c, 63, 903, 594, 94, lt, 1.0, 5.4, 16); glow(c, 63, 1108, 594, 94, lt, 1.6, 5.4, 16); glow(c, 63, 1312, 594, 94, lt, 2.2, 5.4, 16); } },
  { b: TT[6], old: 8, f: (c, lt) => { img(c, '07_paiement');
      glow(c, 63, 698, 594, 94, lt, .5, 3.0, 18); glow(c, 63, 975, 290, 94, lt, 3.4, 6.0, 18); glow(c, 378, 975, 280, 94, lt, 3.4, 6.0, 18);
      drawCursor(c, [{ t: 0, x: 620, y: 900 }, { t: 1.5, x: 300, y: 745 }, { t: 5.6, x: 300, y: 745 }, { t: 6.4, x: 350, y: 1175 }, { t: 6.6, x: 350, y: 1175 }], [1.5, 6.6], lt, 7.5); } },
];
const BOUNDS = SCREENS.map(s => s.b);
const durOf = i => (i + 1 < SCREENS.length ? SCREENS[i + 1].b : TT[7]) - SCREENS[i].b;
const kOf = i => SCREENS[i].old / durOf(i);                 // compresse le temps local des gestes
function drawScreen(t) {
  let idx = 0; for (let i = 0; i < BOUNDS.length; i++) if (t >= BOUNDS[i]) idx = i;
  const tr = idx > 0 ? eio((t - BOUNDS[idx]) / .28) : 1;
  sc.fillStyle = '#000'; sc.fillRect(0, 0, SW, SH);
  sc.save(); rr(sc, 0, 0, SW, SH, 58); sc.clip();
  if (tr < 1) {
    lc.save(); SCREENS[idx - 1].f(lc, Math.min(t - BOUNDS[idx - 1], durOf(idx - 1)) * kOf(idx - 1)); lc.restore();
    sc.drawImage(layer, -SW * .35 * tr, 0); sc.fillStyle = `rgba(0,0,0,${.25 * tr})`; sc.fillRect(0, 0, SW, SH);
  }
  sc.save(); sc.translate(SW * (1 - tr), 0);
  if (tr < 1) { sc.shadowColor = 'rgba(0,0,0,.3)'; sc.shadowBlur = 40; }
  SCREENS[idx].f(sc, (t - BOUNDS[idx]) * kOf(idx)); sc.restore();
  sc.restore();
}

// ---------- 3D ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').prepend(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, .1, 100);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-3, 5, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5; sun.shadow.bias = -0.0004;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.ShadowMaterial({ opacity: .16 }));
floor.position.z = -.9; floor.receiveShadow = true; scene.add(floor);

// phone
const PW = 1.72, PH = 3.64, PR = .3, PD = .13;
const shape = new THREE.Shape();
shape.moveTo(-PW / 2 + PR, -PH / 2); shape.lineTo(PW / 2 - PR, -PH / 2); shape.absarc(PW / 2 - PR, -PH / 2 + PR, PR, -Math.PI / 2, 0);
shape.lineTo(PW / 2, PH / 2 - PR); shape.absarc(PW / 2 - PR, PH / 2 - PR, PR, 0, Math.PI / 2);
shape.lineTo(-PW / 2 + PR, PH / 2); shape.absarc(-PW / 2 + PR, PH / 2 - PR, PR, Math.PI / 2, Math.PI);
shape.lineTo(-PW / 2, -PH / 2 + PR); shape.absarc(-PW / 2 + PR, -PH / 2 + PR, PR, Math.PI, Math.PI * 1.5);
const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: PD, bevelEnabled: true, bevelThickness: .035, bevelSize: .035, bevelSegments: 6, curveSegments: 24 });
bodyGeo.translate(0, 0, -PD / 2);
const phone = new THREE.Group(); scene.add(phone);
const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x1b2420, metalness: .85, roughness: .28 }));
body.castShadow = true; phone.add(body);
const scrTex = new THREE.CanvasTexture(screenCv); scrTex.colorSpace = THREE.SRGBColorSpace; scrTex.anisotropy = 8;
const SCW = 1.58, SCH = SCW * SH / SW;
const scr = new THREE.Mesh(new THREE.PlaneGeometry(SCW, SCH), new THREE.MeshBasicMaterial({ map: scrTex, toneMapped: false }));
scr.position.z = PD / 2 + .037; phone.add(scr);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(SCW, SCH), new THREE.MeshPhysicalMaterial({ transparent: true, opacity: .06, roughness: .05, metalness: 0, clearcoat: 1 }));
glass.position.z = PD / 2 + .04; phone.add(glass);

// floating accent shapes (flag colours)
const accents = [];
const cols = [0x008751, 0xFCD116, 0xE8112D];
for (let i = 0; i < 9; i++) {
  const g = i % 3 === 0 ? new THREE.SphereGeometry(.16, 32, 32) : i % 3 === 1 ? new THREE.TorusGeometry(.17, .055, 20, 40) : new THREE.IcosahedronGeometry(.17, 0);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: cols[i % 3], metalness: .15, roughness: .35 })); m.castShadow = true;
  const a = i / 9 * Math.PI * 2;
  m.userData = { a, r: 2.4 + (i % 3) * .5, y: Math.sin(a * 2) * 1.6, z: -.4 + (i % 4) * .35, s: .8 + (i % 3) * .3 };
  scene.add(m); accents.push(m);
}

// bulletin (paper) texture
function paperTex() {
  const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 1414; const c = cv.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, 1000, 1414);
  const T = (s, x, y, f, col = '#222', al = 'left') => txt(c, s, x, y, f, col, al);
  T('MINISTÈRE DE LA JUSTICE', 70, 82, '700 22px M', '#333'); T('ET DE LA LÉGISLATION', 70, 110, '700 22px M', '#333');
  c.fillStyle = GREEN; c.fillRect(70, 124, 90, 5); c.fillStyle = YELLOW; c.fillRect(160, 124, 90, 5); c.fillStyle = RED; c.fillRect(250, 124, 90, 5);
  T('RÉPUBLIQUE DU BÉNIN', 70, 160, '500 20px M', '#444');
  T('Le centre national du casier judiciaire', 500, 262, '800 34px M', '#111', 'center');
  c.strokeStyle = '#111'; c.lineWidth = 3; c.strokeRect(340, 300, 320, 92);
  T('CASIER JUDICIAIRE', 500, 340, '800 28px M', '#111', 'center'); T('Bulletin n°3', 500, 376, '500 24px M', '#111', 'center');
  T('IDENTITÉ', 70, 470, '800 21px M'); T('INFORMATIONS SUPPLÉMENTAIRES', 540, 470, '800 21px M');
  const rows = [['Nom :', 'EXEMPLE'], ['Prénoms :', 'MARIAM'], ['Date de naissance :', '01-01-1990'], ['Lieu de naissance :', 'Cotonou LITTORAL'], ['Genre :', 'F']];
  rows.forEach((r, i) => { T(r[0], 76, 520 + i * 30, '700 17px M'); T(r[1], 300, 520 + i * 30, '500 17px M'); });
  const rows2 = [['Nationalité :', 'Béninoise'], ['Domicile :', 'Cotonou'], ['Profession :', 'Enseignante'], ['Enfants à charge :', '0']];
  rows2.forEach((r, i) => { T(r[0], 546, 520 + i * 30, '700 17px M'); T(r[1], 760, 520 + i * 30, '500 17px M'); });
  T('FILIATION', 70, 720, '800 21px M');
  T('Nom et Prénom du père :', 76, 764, '700 17px M'); T('EXEMPLE PÈRE', 330, 764, '500 17px M');
  T('Nom et Prénom de la mère :', 76, 794, '700 17px M'); T('EXEMPLE MÈRE', 330, 794, '500 17px M');
  T('Vérification de l’état civil faite sur la base :', 70, 866, '800 26px M');
  c.strokeStyle = '#333'; c.lineWidth = 2; c.strokeRect(76, 892, 14, 14); c.strokeRect(300, 892, 14, 14);
  c.beginPath(); c.moveTo(302, 899); c.lineTo(307, 905); c.lineTo(313, 893); c.stroke();
  T('Registre des personnes physiques', 100, 905, '500 15px M'); T('Enquête par le Procureur de la République', 324, 905, '500 15px M');
  T('Ce bulletin ne mentionne que les condamnations à des peines privatives de liberté prononcées par', 76, 950, '500 15px M', '#444');
  T('une juridiction de répression pour crime et délit.', 76, 972, '500 15px M', '#444');
  T('Condamnations', 70, 1030, '800 28px M'); T('AUCUNE CONDAMNATION', 76, 1068, '500 17px M');
  c.setLineDash([8, 6]); c.strokeStyle = '#B5BDB8'; c.lineWidth = 2; c.strokeRect(560, 1110, 340, 120); c.setLineDash([]);
  T('Signature et cachet', 730, 1165, '600 16px M', '#9AA39D', 'center'); T('(spécimen)', 730, 1190, '500 15px M', '#9AA39D', 'center');
  T('Numéro de référence :', 76, 1120, '500 15px M'); T('XXXX XXXX XXXX', 76, 1146, '700 17px M');
  c.strokeStyle = '#C7CEC9'; c.lineWidth = 2; c.strokeRect(76, 1260, 850, 100);
  T('VÉRIFIEZ LA CONFORMITÉ DE CE DOCUMENT', 190, 1288, '800 14px M');
  T('1. Suivez les instructions de https://service-public.bj/public/search-document', 190, 1312, '500 13px M');
  T('2. Utilisez le numéro de référence', 190, 1332, '500 13px M'); T('3. Assurez-vous que le document est identique à celui en ligne', 190, 1352, '500 13px M');
  c.fillStyle = GREEN; c.fillRect(380, 1396, 80, 6); c.fillStyle = YELLOW; c.fillRect(460, 1396, 80, 6); c.fillStyle = RED; c.fillRect(540, 1396, 80, 6);
  c.save(); c.translate(500, 760); c.rotate(-0.55); c.globalAlpha = .16; txt(c, 'SPÉCIMEN', 0, 0, '900 190px M', RED, 'center'); c.restore();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const paper = new THREE.Mesh(new THREE.BoxGeometry(1.34, 1.9, .02), (tx => new THREE.MeshStandardMaterial({ map: tx, emissiveMap: tx, emissive: 0xffffff, emissiveIntensity: .55, roughness: .6, metalness: 0 }))(paperTex()));
paper.castShadow = true; paper.visible = false; scene.add(paper);

// recap cards
function cardTex(label, value, color) {
  const cv = document.createElement('canvas'); cv.width = 760; cv.height = 400; const c = cv.getContext('2d');
  c.fillStyle = '#fff'; rr(c, 0, 0, 760, 400, 44); c.fill();
  c.fillStyle = color; rr(c, 0, 0, 760, 26, 0); c.save(); rr(c, 0, 0, 760, 400, 44); c.clip(); c.fillRect(0, 0, 760, 26); c.restore();
  txt(c, label.toUpperCase(), 52, 130, '700 30px M', '#7A857E');
  const fs = value.length > 12 ? 62 : 78; txt(c, value, 52, 250, `900 ${fs}px M`, color === YELLOW ? INK : color);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const CARDS = [['Accès', 'service-public.bj', GREEN], ['Pièces à fournir', 'Aucune', GREEN], ['Frais', '1 900 F CFA', '#C9A100'], ['Délivrance', 'Instantanée', RED]];
const cards = CARDS.map(([l, v, col], i) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.1, .05), (tx => new THREE.MeshStandardMaterial({ map: tx, emissiveMap: tx, emissive: 0xffffff, emissiveIntensity: .5, roughness: .5 }))(cardTex(l, v, col)));
  m.castShadow = true; m.visible = false; scene.add(m); return m;
});
const CARD_POS = [[1.45, 1.0], [3.5, 1.0], [1.45, -.45], [3.5, -.45]];

// outro flag slabs
const slabs = cols.map((c, i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(2.6, .5, .12), new THREE.MeshStandardMaterial({ color: c, roughness: .4 })); m.castShadow = true; m.visible = false; scene.add(m); return m; });

// ---------- captions ----------
const CAPS = [
  { a: TT[0], b: TT[1], kick: 'Guide vidéo · non officiel', ttl: 'Casier judiciaire<br><span style="color:#008751">en ligne</span>', sub: 'Votre bulletin, instantanément.<br>Le parcours pas à pas sur service-public.bj' },
  { a: TT[1], b: TT[2], step: 1, kick: 'Étape 1', ttl: 'Ouvrez le site', sub: '<b>service-public.bj</b> puis <b>« Trouver un service »</b>' },
  { a: TT[2], b: TT[3], step: 2, kick: 'Étape 2', ttl: 'Choisissez<br>le service', sub: '<b>« Délivrance du Casier judiciaire (Extrait B3) »</b>, puis <b>« Faire une demande »</b>' },
  { a: TT[3], b: TT[4], step: 3, kick: 'Étape 3', ttl: 'Indiquez<br>votre profil', sub: 'Béninois ou étranger, né ici ou ailleurs : choisissez, puis <b>« Soumettre »</b>' },
  { a: TT[4], b: TT[5], step: 4, kick: 'Étape 4', ttl: 'Code OTP', sub: 'Saisissez le code reçu <b>par e-mail</b>, puis <b>« Continuer »</b>' },
  { a: TT[5], b: TT[6], step: 5, kick: 'Étape 5', ttl: 'Vérifiez vos<br>informations', sub: 'NPI, e-mail, nationalité : <b>déjà renseignés</b>. Dites-le nous une fois.' },
  { a: TT[6], b: TT[7], step: 6, kick: 'Étape 6', ttl: 'Payez<br>1 900 F CFA', sub: 'Profession, puis <b>Fedapay</b> ou <b>Kkiapay</b>, et <b>« Soumettre »</b>' },
  { a: TT[7], b: TT[8], step: 7, kick: 'Étape 7', ttl: 'Votre bulletin,<br>instantanément', sub: 'Téléchargeable immédiatement. <i>(Spécimen fictif.)</i>' },
  { a: TT[8], b: TT[9], kick: 'En pratique', ttl: 'Aucune pièce.<br>Aucun déplacement.', sub: 'Même depuis l’étranger. Même valeur juridique.' },
  { a: TT[9], b: TT[10], kick: 'Bon à savoir', ttl: 'Dites-le<br>nous une fois.', sub: 'Source : communiqué du Ministère de la Justice et de la Législation (Bénin), 2 novembre 2026. Captures réelles, données fictives. Certains moyens de paiement peuvent être temporairement indisponibles. Vidéo non officielle.', small: true },
];
const el = id => document.getElementById(id);
let capIdx = -1;
function setCaption(t) {
  let i = CAPS.findIndex(c => t >= c.a && t < c.b); if (i < 0) i = CAPS.length - 1;
  const cp = CAPS[i];
  if (i !== capIdx) {
    capIdx = i;
    el('kick').textContent = cp.kick; el('ttl').innerHTML = cp.ttl; el('sub').innerHTML = cp.sub;
    el('sub').className = cp.small ? 'small' : '';
    const n = el('num'); n.style.display = cp.step ? 'flex' : 'none'; n.textContent = cp.step || '';
    document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', cp.step ? k < cp.step : false));
    el('dots').style.display = cp.step ? 'flex' : 'none';
  }
  const lt = t - cp.a, last = i === CAPS.length - 1;
  const inn = eo(lt / .3), out = last ? 0 : eo((cp.b - t) / .2);
  const o = Math.min(inn, last ? 1 : 1 - (1 - out));
  el('cap').style.opacity = last ? inn : Math.min(inn, out);
  el('cap').style.transform = `translateX(${(1 - inn) * -90}px)`;
  el('dots').style.opacity = cp.step ? Math.min(inn, out) : 0;
  el('bar').style.width = (t / DUR * 1920) + 'px';
}

// ---------- timeline ----------
function render(t) {
  drawScreen(t); scrTex.needsUpdate = true;
  setCaption(t);
  const ent = back(t / .9);
  let px = 1.95, py = lerp(-3.2, 0, eo(t / .8)), ps = lerp(.55, 1, ent);
  let ry = lerp(1.3, -.28, eio(t / 1.1)) + .09 * Math.sin(t * .8), rx = .05 * Math.sin(t * .6) - .04;
  let camZ = 9, camX = 0;
  if (t >= TT[1] - .6) { const k = eio((t - TT[1] + .6) / .6); camZ = lerp(9, 8.1, k); px = lerp(1.95, 1.75, k); ry = lerp(ry, -.2 + .06 * Math.sin(t * .8), k); }
  for (let i = 1; i <= 6; i++) { const a0 = TT[i] + .5, b0 = TT[i + 1] - .3; if (t > a0 && t < b0) ry -= .11 * Math.sin(clamp((t - a0) / (b0 - a0)) * Math.PI); }
  if (t >= TT[7] && t < TT[8]) px = lerp(px, 1.15, eio((t - TT[7]) / .5));
  let pvis = 1;
  if (t >= TT[8]) {
    const k = eio((t - TT[8]) / .5);
    camZ = lerp(8.1, 10, eio((t - TT[8]) / .8)); px = lerp(1.15, 6.5, k); ps *= 1 - .3 * k; ry = lerp(ry, -.7, k); pvis = 1 - k;
  }
  // coup de caméra à chaque changement d'écran (zoom + virage du téléphone)
  for (let i = 1; i <= 8; i++) { const d = t - TT[i]; if (d > 0 && d < .45) { const p = 1 - eo(d / .45); camZ -= .55 * p; ry += (i % 2 ? .4 : -.4) * p; } }
  phone.position.set(px, py, 0); phone.scale.setScalar(Math.max(ps, .001)); phone.rotation.set(rx, ry, 0);
  phone.visible = pvis > .01;
  camera.position.set(camX, 0, camZ); camera.lookAt(camX, 0, 0);
  const aShow = eo(t / .8) * (1 - eo((t - TT[9]) / .4));
  accents.forEach((m, i) => {
    const u = m.userData, a = u.a + t * .3;
    m.position.set(px + Math.cos(a) * u.r * .9 - .2, u.y + Math.sin(t * 1.1 + i) * .2, u.z - 1.0 + Math.sin(a) * .8);
    m.rotation.set(t * .9 + i, t * .6, 0); m.scale.setScalar(u.s * aShow + .0001);
    m.visible = aShow > .01;
  });
  const pk = (t - TT[7] - .2) / .7;
  paper.visible = pk > 0 && t < TT[8] + .3;
  if (paper.visible) {
    const k = eo(pk), fadeOut = 1 - eo((t - TT[8]) / .3);
    paper.position.set(lerp(px, px + 1.6, k), lerp(0, .2, k) + .06 * Math.sin(t * 2), lerp(.1, .5, k));
    paper.rotation.set(.1 * k, lerp(0, -.22, k) + .06 * Math.sin(t * 1.3), lerp(0, .08, k));
    paper.scale.setScalar(Math.max(lerp(.35, 1.12, back(pk)), .001) * fadeOut);
  }
  cards.forEach((m, i) => {
    const k = back((t - TT[8] - .25 - i * .14) / .45), out = 1 - eo((t - TT[9]) / .35);
    m.visible = k > .01 && out > .01 && t < TT[9] + .5;
    if (!m.visible) return;
    m.position.set(CARD_POS[i][0], CARD_POS[i][1] + .12 * Math.sin(t * 1.8 + i), lerp(-1.5, .2, clamp(k)));
    m.rotation.set(-.06 + .04 * Math.sin(t + i), .22 + .05 * Math.sin(t * .9 + i), 0);
    m.scale.setScalar(Math.max(k * out * .85, .001));
  });
  slabs.forEach((m, i) => {
    const k = back((t - TT[9] - .2 - i * .12) / .5);
    m.visible = k > .01;
    m.position.set(lerp(7, 3.3, clamp(k)), 1 - i * .7 + .05 * Math.sin(t + i), 0);
    m.rotation.set(0, -.35, 0); m.scale.setScalar(Math.max(k, .001));
  });
  renderer.render(scene, camera);
}
window.render = render;
window.ready = Promise.resolve().then(() => { render(0); });
if (!new URLSearchParams(location.search).has('render')) {
  window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
}
</script>
