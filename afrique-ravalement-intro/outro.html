<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Afrique Ravalement · Outro</title>
<style>
  @font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: M; font-weight: 600; src: url(assets/montserrat-latin-600-normal.woff2); }
  html, body { margin: 0; background: #111; }
  svg { display: block; width: 1080px; height: 1920px; }
  text { font-family: M; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#C9622A"/><stop offset="1" stop-color="#B05316"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#111"/>
  <g id="cam">
    <rect x="-100" y="-100" width="1280" height="2120" fill="url(#glow)"/>
    <g id="stripes" opacity=".04"></g>
    <g id="rings" fill="none" stroke="#fff" stroke-width="3"></g>
    <g id="spray" fill="#fff"></g>

    <g id="logoG"><image href="assets/logo_noir_crop.png" width="820" height="282" x="-410" y="-141"/></g>

    <g id="head"></g>

    <!-- phones -->
    <rect id="phBar" fill="#111"/>
    <g id="phIcon"><image href="assets/icon_phone.png" x="-55" y="-55" width="110" height="110" style="filter:invert(1)"/></g>
    <g id="P1"></g><g id="P2"></g>

    <!-- mail -->
    <g id="mailIcon"><rect x="-44" y="-30" width="88" height="60" rx="6" fill="#111"/><path d="M-44 -24 L0 6 L44 -24" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g>
    <g id="M"></g>
    <rect id="mailRule" height="6" fill="#111"/>

    <!-- socials -->
    <g id="ic0"><image href="assets/icon_facebook.png" x="-60" y="-60" width="120" height="120"/></g>
    <g id="ic1"><image href="assets/icon_instagram.png" x="-60" y="-60" width="120" height="120"/></g>
    <g id="ic2"><image href="assets/icon_tiktok.png" x="-60" y="-60" width="120" height="120"/></g>
    <rect id="nameBar" fill="#111"/>
    <g id="S"></g>
    <rect id="spacer" width="0" height="0"/>
    <rect width="1080" height="1920" fill="url(#vig)" pointer-events="none"/>
  </g>
  <rect id="bar" y="-100" width="1500" height="2120" fill="#111" opacity="0"/>
  <g id="cols"></g>
  <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0"/>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const set = (n, a) => { for (const k in a) n.setAttribute(k, a[k]); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eOutQuint = k => 1 - Math.pow(1 - k, 5);
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eInOutQuint = k => k < .5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2;
const eOutBack = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const DUR = 5, BEATS = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5];
const L = { rings: [], spray: [], cols: [], stripes: [] };

function widthAt(str, weight) { const m = el('text', { 'font-family': 'M', 'font-weight': weight, 'font-size': 100, visibility: 'hidden' }, $('stage')); m.textContent = str; const w = m.getComputedTextLength(); m.remove(); return w; }
// per-letter text, centred on cx, fitted to a target width
function letters(str, w, fill, cx, cy, parent, weight = 800) {
  const fs = 100 * w / widthAt(str, weight);
  const m = el('text', { 'font-family': 'M', 'font-weight': weight, 'font-size': fs, x: 0, y: 0, visibility: 'hidden' }, $('stage'));
  m.textContent = str; const total = m.getComputedTextLength(), x0 = cx - total / 2, out = [];
  for (let i = 0; i < str.length; i++) {
    if (str[i] === ' ') continue;
    const e = m.getExtentOfChar(i), g = el('g', {}, parent);
    const t = el('text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-weight': weight, 'font-size': fs, fill }, g);
    t.textContent = str[i];
    out.push({ g, px: x0 + e.x + e.width / 2, y: cy, c: fs * .36, i });
  }
  m.remove(); return { list: out, fs, total };
}
const place = (l, dy, r, s, op = 1) => {
  l.g.setAttribute('transform', `translate(${l.px},${l.y + dy}) translate(0,${-l.c}) rotate(${r}) scale(${s}) translate(0,${l.c})`);
  l.g.setAttribute('opacity', op);
};
const popAll = (G, t0, step, t, dir = 1) => G.list.forEach((l, n) => {
  const p = prog(t, t0 + n * step, t0 + n * step + .38), k = eOutBack(p, 2.6);
  place(l, (1 - eOutCubic(p)) * -70 * dir, (1 - eOutCubic(p)) * (n % 2 ? 12 : -12), Math.max(k, 0), p > 0 ? 1 : 0);
});

const POS = { head: 740, ph1: 915, ph2: 1015, mail: 1245, ic: 1450, name: 1650 };
function layout() {
  L.head = letters('CONTACTEZ-NOUS', 600, '#111', 540, POS.head, $('head'));
  L.P1 = letters('01 90 51 28 29', 600, '#fff', 590, POS.ph1, $('P1'));
  L.P2 = letters('01 69 13 83 83', 600, '#fff', 590, POS.ph2, $('P2'));
  L.M = letters('hello@afriqueravalement.com', 880, '#fff', 540, POS.mail, $('M'), 800);
  L.S = letters('Afrique Ravalement', 640, '#fff', 540, POS.name, $('S'));
  for (let i = 0; i < 10; i++) L.rings.push(el('circle', { r: 0, opacity: 0 }, $('rings')));
  for (let i = 0; i < 60; i++) L.spray.push(el('circle', { r: 0 }, $('spray')));
  for (let i = 0; i < 7; i++) L.cols.push(el('rect', { x: i * 156, y: 0, width: 157, height: 1920, fill: '#111' }, $('cols')));
  for (let i = 0; i < 9; i++) L.stripes.push(el('rect', { x: i * 360 - 360, y: -600, width: 130, height: 3200, fill: '#fff', transform: 'rotate(18 540 960)' }, $('stripes')));
}

function logoT(t) {
  const k = eOutExpo(prog(t, 0.45, 0.85)), lift = eInOutQuint(prog(t, 1.0, 1.55));
  const beat = BEATS.filter(b => b >= 3.5 && t >= b).reduce((m, b) => Math.max(m, .035 * Math.exp(-(t - b) * 10)), 0);
  return { s: lerp(2.4, 1, k) * lerp(1, .86, lift) * (1 + beat), r: lerp(-8, 0, k), x: 540, y: lerp(820, 390, lift), vis: t >= 0.45 };
}
const NOZ = { x: -62, y: -93 };
function nozzle(t) { const T = logoT(t), a = T.r * Math.PI / 180; return { x: T.x + T.s * (NOZ.x * Math.cos(a) - NOZ.y * Math.sin(a)), y: T.y + T.s * (NOZ.x * Math.sin(a) + NOZ.y * Math.cos(a)) }; }
const BURSTS = [0.62, 4.02];
const SHAKES = [[0.5, 16], [1.0, 8], [1.5, 8], [2.5, 8], [3.0, 5], [4.0, 10]];

function render(t) {
  const frame = Math.round(t * 60);
  let amp = 0; for (const [b, a] of SHAKES) if (t >= b) amp += a * Math.exp(-(t - b) * 15);
  $('cam').setAttribute('transform', `translate(${(hash(frame, 1) - .5) * 2 * amp},${(hash(frame, 2) - .5) * 2 * amp}) rotate(${(hash(frame, 3) - .5) * amp * .05} 540 960)`);
  const off = (t * 140) % 360; L.stripes.forEach((s, i) => s.setAttribute('x', i * 360 - 360 + off));

  L.rings.forEach((c, i) => {
    const age = t - (BEATS[i] ?? 99);
    if (age < 0 || age > 1) { c.setAttribute('opacity', 0); return; }
    const T = logoT(t);
    set(c, { cx: T.x, cy: T.y, r: 60 + 1150 * eOutCubic(age), opacity: (BEATS[i] === 0.5 || BEATS[i] === 4.0 ? .45 : .2) * (1 - age), 'stroke-width': lerp(10, 2, age) });
  });

  let pi = 0;
  BURSTS.forEach((t0, bi) => {
    const o = nozzle(t0);
    for (let j = 0; j < 50; j++, pi++) {
      const c = L.spray[pi]; if (!c) continue; const age = t - t0, life = lerp(.7, 1.2, hash(j, bi + 7));
      if (age < 0 || age > life) { c.setAttribute('r', 0); continue; }
      const ang = (-38 + 52 * hash(j, bi + 1)) * Math.PI / 180, v = lerp(500, 1600, hash(j, bi + 2) ** 1.4);
      set(c, { cx: o.x + Math.cos(ang) * v * age, cy: o.y + Math.sin(ang) * v * age + .5 * 1800 * age * age, r: lerp(3, 11, hash(j, bi + 3)) * (1 - .6 * age / life), opacity: .9 * (1 - Math.pow(age / life, 2)) });
    }
  });

  const T = logoT(t);
  set($('logoG'), { transform: `translate(${T.x},${T.y}) rotate(${T.r}) scale(${T.s})`, opacity: T.vis ? 1 : 0 });

  // heading
  popAll(L.head, 1.2, .03, t);

  // phones: black bar wipes in, icon spins, numbers pop
  const pb = eOutExpo(prog(t, 1.25, 1.6));
  set($('phBar'), { x: 120, y: 835, width: 840 * pb, height: 230 });
  const ip = eOutBack(prog(t, 1.45, 1.85), 2.4);
  set($('phIcon'), { transform: `translate(215,950) rotate(${(1 - eOutQuint(prog(t, 1.45, 2.0))) * -360}) scale(${Math.max(ip, 0)})` });
  popAll(L.P1, 1.5, .028, t); popAll(L.P2, 1.62, .028, t);

  // mail
  const mp = eOutBack(prog(t, 2.0, 2.4), 2.4);
  set($('mailIcon'), { transform: `translate(540,1160) scale(${Math.max(mp, 0)})` });
  popAll(L.M, 2.15, .022, t);
  const mr = eOutExpo(prog(t, 2.7, 3.0)); set($('mailRule'), { x: 540 - 440 * mr, y: 1290, width: 880 * mr });

  // socials: three icons pop with a spin, then the name on a black bar
  [0, 1, 2].forEach(i => {
    const t0 = 2.6 + i * .15, p = prog(t, t0, t0 + .45), k = eOutBack(p, 2.6);
    set($('ic' + i), { transform: `translate(${540 + (i - 1) * 190},${POS.ic}) rotate(${(1 - eOutQuint(p)) * 360}) scale(${Math.max(k, 0)})` });
  });
  const nb = eOutExpo(prog(t, 3.1, 3.5)), nw = L.S.total + 70;
  set($('nameBar'), { x: 540 - nw / 2, y: POS.name - 62, width: nw * nb, height: 100 });
  popAll(L.S, 3.35, .03, t);

  // opening columns + hit flash
  L.cols.forEach((c, i) => { const k = eOutExpo(prog(t, i * .045, i * .045 + .32)); set(c, { y: -1920 * k, opacity: k >= 1 ? 0 : 1 }); });
  $('flash').setAttribute('opacity', (t >= .5 ? .35 * Math.exp(-(t - .5) * 22) : 0) + (t >= 4 ? .22 * Math.exp(-(t - 4) * 22) : 0));
}

window.ready = Promise.all([document.fonts.load('800 40px M'), document.fonts.load('600 40px M')]).then(() => document.fonts.ready).then(() => { layout(); render(0); });
window.render = render;
window.ready.then(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { render(+q.get('t')); return; }
  if (q.has('render')) return;
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % (DUR + .8)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
