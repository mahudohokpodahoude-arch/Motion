<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Présentation — Dr Hestia Segbey Daoudou</title>
    <script src="gsap/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas"; src: url("assets/bebas-neue-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 600; src: url("assets/montserrat-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/montserrat-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ee1a02; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #fff; font-family: "Bebas", sans-serif;
        background: linear-gradient(115deg, #ee1a02 0%, #f12e04 38%, #f5541a 72%, #fb7a2a 100%); }
      .abs { position: absolute; }
      .sh { inset: 0; }
      .s1 { background: #ff7a33; opacity: .20; clip-path: polygon(0 0, 14% 0, 5% 100%, 0 100%); }
      .s2 { background: #b80f00; opacity: .20; clip-path: polygon(26% 0, 36% 0, 22% 100%, 12% 100%); }
      .s3 { background: #ff9a4a; opacity: .16; clip-path: polygon(58% 0, 68% 0, 56% 100%, 46% 100%); }
      .s4 { background: #c01200; opacity: .18; clip-path: polygon(84% 0, 100% 0, 100% 100%, 72% 100%); }
      #glow { left: 960px; top: 40px; width: 1000px; height: 1000px; background: radial-gradient(closest-side, rgba(255,175,115,.7), rgba(255,175,115,0)); }
      #photo { left: 930px; top: -10px; width: 965px; height: 1350px; background: url("assets/hestia_cutout.png") center/100% 100% no-repeat; transform-origin: 50% 40%; filter: drop-shadow(0 20px 40px rgba(110,10,0,.35)); }
      #logo { left: 70px; top: 46px; width: 130px; height: 130px; }
      #tag { left: 240px; top: 84px; font-family: "Mont"; font-weight: 800; font-size: 26px; letter-spacing: .14em; background: #fff; color: #d8300a; padding: 14px 28px; border-radius: 40px; }
      #nom { left: 70px; top: 200px; line-height: .88; text-shadow: 0 8px 28px rgba(110,10,0,.35); }
      #nom .a { font-size: 190px; letter-spacing: .015em; white-space: nowrap; }
      #nom .b { font-size: 112px; letter-spacing: .02em; white-space: nowrap; color: #ffe3cf; }
      #nom span { display: inline-block; }
      .card { left: 70px; width: 800px; height: 78px; display: flex; align-items: stretch; opacity: 0; }
      .card .n { flex: none; width: 18px; background: #0260a6; }
      .card .c { flex: 1; background: rgba(255,255,255,.16); border-radius: 0 8px 8px 0; display: flex; align-items: center; padding: 6px 28px 0; font-size: 50px; letter-spacing: .03em; white-space: nowrap; }
      .card .c small { font-family: "Mont"; font-weight: 800; font-size: 22px; letter-spacing: 0; color: #ffe3cf; margin-left: 16px; padding-top: 0; }
      #c1 { top: 520px; } #c2 { top: 610px; } #c3 { top: 700px; }
      #pan { left: 70px; top: 810px; width: 800px; }
      #pan .h { font-family: "Mont"; font-weight: 800; font-size: 22px; letter-spacing: .14em; color: #ffe3cf; margin-bottom: 10px; opacity: 0; }
      .pr { display: flex; gap: 14px; align-items: stretch; margin-bottom: 10px; opacity: 0; height: 74px; }
      .pr .t { flex: none; width: 150px; background: #0260a6; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: "Mont"; font-weight: 800; font-size: 26px; letter-spacing: .06em; box-shadow: 0 6px 16px rgba(80,0,0,.28); }
      .pr .x { flex: 1; background: #fff; color: #d8300a; border-radius: 8px; padding: 0 24px; font-size: 46px; letter-spacing: .02em; white-space: nowrap; display: flex; align-items: center; padding-top: 5px; }
      .pr .x small { font-family: "Mont"; font-weight: 800; font-size: 19px; letter-spacing: .08em; color: #8a3a22; margin-left: 14px; padding-top: 0; }
      #foot { left: 70px; bottom: 30px; font-size: 28px; letter-spacing: .07em; opacity: 0; text-shadow: 0 2px 8px rgba(110,10,0,.4); }
      #wipe { inset: 0; background: #0260a6; }
      #flash { inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div class="sh abs s1"></div><div class="sh abs s2"></div><div class="sh abs s3"></div><div class="sh abs s4"></div>
      <div id="glow" class="abs"></div>
      <div id="photo" class="abs"></div>
      <img id="logo" class="abs" src="assets/logos_alpha.png" alt="Zone 242" />
      <div id="tag" class="abs">PANÉLISTE</div>
      <div id="nom" class="abs">
        <div class="a"><span>D</span><span>R</span><span>&nbsp;</span><span>H</span><span>E</span><span>S</span><span>T</span><span>I</span><span>A</span></div>
        <div class="b"><span>S</span><span>E</span><span>G</span><span>B</span><span>E</span><span>Y</span><span>&nbsp;</span><span>D</span><span>A</span><span>O</span><span>U</span><span>D</span><span>O</span><span>U</span></div>
      </div>
      <div id="c1" class="card abs"><div class="n"></div><div class="c">DOCTEUR EN MÉDECINE</div></div>
      <div id="c2" class="card abs"><div class="n"></div><div class="c">CONSULTANTE BIEN-ÊTRE<small>périnatalité et parentalité</small></div></div>
      <div id="c3" class="card abs"><div class="n"></div><div class="c">LEADER DE LA TDM<small>Tour de Mariage</small></div></div>
      <div id="pan" class="abs">
        <div class="h">SAMEDI 21 NOVEMBRE</div>
        <div class="pr" id="p1"><div class="t">PANEL 2</div><div class="x">Femme et l’appel</div></div>
        <div class="pr" id="p2"><div class="t">PANEL 4</div><div class="x">La femme sage bâtit sa maison<small>GRANDE SALLE</small></div></div>
      </div>
      <div id="foot" class="abs">WEEK-END ZONE WOMEN · 20–22 NOVEMBRE 2026 · ZONE 242, SIKECODJI</div>
      <div id="wipe" class="abs"></div>
      <div id="flash" class="abs"></div>
      <audio id="snd" src="assets/musique.mp3" data-start="0" data-duration="10" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      // rythme : 120 bpm, un temps = 0,5 s ; les gestes tombent sur les temps
      const tl = gsap.timeline({ paused: true });
      gsap.set("#photo", { scale: 1.08, x: 80, opacity: 0 });
      gsap.set("#glow", { scale: .6, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#logo", { y: -30, opacity: 0 });
      gsap.set("#tag", { x: -60, opacity: 0 });
      gsap.set("#nom span", { yPercent: 120, rotate: -10, opacity: 0 });
      gsap.set(".card", { x: -120, opacity: 0 });
      gsap.set("#pan .h", { y: 14, opacity: 0 });
      gsap.set(".pr", { x: -140, opacity: 0 });
      gsap.set("#foot", { y: 24, opacity: 0 });

      tl.fromTo("#wipe", { clipPath: "circle(150% at 70% 45%)" }, { clipPath: "circle(0% at 70% 45%)", duration: 0.6, ease: "power3.inOut" }, 0);
      tl.to("#glow", { scale: 1, opacity: 1, duration: 1.4, ease: "power2.out" }, 0.2);
      tl.to("#photo", { opacity: 1, x: 0, scale: 1, duration: 1.1, ease: "power3.out" }, 0.3);
      tl.to("#photo", { scale: 1.04, duration: 9, ease: "sine.inOut" }, 1.4);
      tl.to("#logo", { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.to("#tag", { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.6);
      // 1,0 s — le nom claque lettre après lettre
      tl.to("#nom .a span", { yPercent: 0, rotate: 0, opacity: 1, duration: 0.3, ease: "back.out(2.2)", stagger: 0.04 }, 1.0);
      tl.to("#nom .b span", { yPercent: 0, rotate: 0, opacity: 1, duration: 0.26, ease: "back.out(2)", stagger: 0.022 }, 1.3);
      // 2,0 / 3,0 / 4,0 s — les trois titres
      [["#c1", 2.0], ["#c2", 3.0], ["#c3", 4.0]].forEach(([id, at]) => tl.to(id, { x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, at));
      // 5,5 / 6,0 / 7,0 s — les deux panels
      tl.to("#pan .h", { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 5.5);
      tl.to("#p1", { x: 0, opacity: 1, duration: 0.42, ease: "back.out(1.5)" }, 6.0);
      tl.to("#p2", { x: 0, opacity: 1, duration: 0.42, ease: "back.out(1.5)" }, 7.0);
      // 8,0 s — mesure finale : pied de page, léger flash
      tl.to("#foot", { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 8.0);
      tl.to("#flash", { opacity: 0.55, duration: 0.06, ease: "power2.out" }, 8.0);
      tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.in" }, 8.06);
      tl.to("#nom", { scale: 1.02, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "0% 50%" }, 8.0);
      tl.to("#root", { opacity: 1, duration: 0.01 }, 10);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
