      <audio id="snd" src="assets/sound.mp3" data-start="0" data-duration="4" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.phone) document.getElementById("ph").textContent = vars.phone;
      if (vars.email) document.getElementById("em").textContent = vars.email;

      const sp = document.getElementById("sparks"), SPARKS = [];
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + 0.2, r = 330 + (i % 3) * 80;
        const el = document.createElement("i"); sp.appendChild(el);
        SPARKS.push({ el, x: 540 + Math.cos(a) * r * 1.05, y: 730 + Math.sin(a) * r * 0.75, s: 0.5 + (i % 4) * 0.28 });
      }
      const tl = gsap.timeline({ paused: true });
      gsap.set("#logo", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(".card", { y: 160, opacity: 0, scale: 0.93, transformOrigin: "50% 100%" });
      gsap.set(".card .ic", { scale: 0 });
      gsap.set("#social .s", { scale: 0 });
      gsap.set("#social .nm", { x: 30, opacity: 0 });
      gsap.set("#qmarks span", { opacity: 0 });
      gsap.set("#glow", { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" });
      SPARKS.forEach((s) => gsap.set(s.el, { x: 533, y: 723, scale: 0 }));

      tl.to("#glow", { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, 0.05);
      tl.to("#qmarks span", { opacity: 0.07, duration: 1, stagger: 0.08, ease: "sine.out" }, 0.2);
      tl.to("#qmarks span", { y: -60, duration: 4, ease: "none" }, 0);
      // 0,15 s — le logo
      tl.to("#logo", { scale: 1, opacity: 1, duration: 0.65, ease: "elastic.out(1, 0.55)" }, 0.15);
      // 0,55 → 0,95 s — éclats
      SPARKS.forEach((s, i) => {
        const at = 0.55 + (i % 4) * 0.1 + Math.floor(i / 4) * 0.02;
        tl.to(s.el, { x: s.x - 7, y: s.y - 7, scale: s.s, opacity: 1, duration: 0.45, ease: "expo.out" }, at);
        tl.to(s.el, { opacity: 0, scale: 0, duration: 0.5, ease: "power2.in" }, at + 0.7);
      });
      // 1,0 s et 1,45 s — les deux cartes
      [["#c1", 1.0], ["#c2", 1.45]].forEach(([id, at]) => {
        tl.to(id, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, at - 0.1);
        tl.to(id + " .ic", { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, at + 0.05);
        tl.fromTo(id + " .tx", { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, at + 0.08);
      });
      tl.fromTo("#root", { x: 0, y: 0 }, { keyframes: [{ x: -5, y: 4, duration: 0.04 }, { x: 4, y: -3, duration: 0.05 }, { x: 0, y: 0, duration: 0.1 }], ease: "power1.out" }, 1.0);
      tl.fromTo("#root", { x: 0, y: 0 }, { keyframes: [{ x: -5, y: 4, duration: 0.04 }, { x: 4, y: -3, duration: 0.05 }, { x: 0, y: 0, duration: 0.1 }], ease: "power1.out", immediateRender: false }, 1.45);
      // 1,9 → 2,2 s — les réseaux, un par un, puis « Zone 242 »
      tl.to("#social .s", { scale: 1, duration: 0.4, ease: "back.out(2.6)", stagger: 0.1 }, 1.9);
      tl.to("#social .nm", { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.25);
      // 2,6 s — résolution : flash doux, le logo respire
      tl.to("#flash", { opacity: 1, duration: 0.12, ease: "power2.out" }, 2.6);
      tl.to("#flash", { opacity: 0, duration: 0.7, ease: "power2.in" }, 2.72);
      tl.to("#logo", { scale: 1.06, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.6);
      tl.to("#root", { opacity: 1, duration: 0.01 }, 4);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
